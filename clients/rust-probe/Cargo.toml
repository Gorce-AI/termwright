[package]
name = "termwright-probe-ratatui"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Zero-config semantic probe for Ratatui applications: the std-side half that a patched ratatui-core calls into"
license = "MIT"
repository = "https://github.com/gorce-ai/termwright"
publish = false

[dependencies]
termwright-protocol = { path = "../rust", version = "0.1.0" }

# Test-only. A dev-dependency is not built when the patched framework depends
# on this crate, so nothing here follows Ratatui into an instrumented user's
# build — which is the reason the crate itself has no runtime dependencies
# beyond the protocol client.
[dev-dependencies]
serde_json = "1"
