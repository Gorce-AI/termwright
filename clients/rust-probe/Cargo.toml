[package]
name = "termwright-probe-ratatui"
version = "0.3.2"
edition = "2021"
rust-version = "1.74"
description = "Zero-config semantic probe for Ratatui applications: the std-side half that a patched ratatui-core calls into"
license = "MIT"
repository = "https://github.com/gorce-ai/termwright"
documentation = "https://docs.rs/termwright-probe-ratatui"
readme = "README.md"
keywords = ["terminal", "tui", "testing", "accessibility"]
categories = ["development-tools::testing", "command-line-interface"]

[dependencies]
termwright-protocol = { path = "../rust", version = "0.3.2" }
serde_json = "1"

# Keep runtime dependencies small: the protocol client owns transport and
# serde_json is shared with the optional author-intent SDK.
