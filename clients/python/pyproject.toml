[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termwright"
version = "0.5.0"
description = "Semantic side-channel client, automatic Textual probe, and annotation SDK for Termwright"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "termwright contributors" }]
keywords = ["terminal", "tui", "testing", "textual", "accessibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
textual = ["textual>=8.2.8"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "textual>=8.2.8"]

[project.urls]
Homepage = "https://github.com/gorce-ai/termwright"
Source = "https://github.com/gorce-ai/termwright/tree/main/clients/python"

[tool.hatch.build.targets.wheel]
packages = ["src/termwright", "src/termwright_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
