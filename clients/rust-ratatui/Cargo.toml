[package]
name = "termwright-ratatui"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Author-intent annotations for custom Ratatui widgets observed by Termwright"
license = "MIT"
repository = "https://github.com/gorce-ai/termwright"
documentation = "https://docs.rs/termwright-ratatui"
readme = "README.md"
keywords = ["terminal", "tui", "testing", "accessibility"]
categories = ["development-tools::testing", "command-line-interface"]

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["std"] }
serde_json = "1"
termwright-probe-ratatui = { path = "../rust-probe", version = "0.3.0" }
termwright-protocol = { path = "../rust", version = "0.3.0" }
