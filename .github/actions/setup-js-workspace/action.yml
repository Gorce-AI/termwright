name: Set up the JavaScript workspace
description: Install the pinned pnpm release, select Node, restore its pnpm cache and install the lockfile.

inputs:
  node-version:
    description: Supported Node.js major to install.
    required: false
    default: '22'
  compile-native-pty:
    description: Compile the host POSIX PTY addon for jobs that launch terminals.
    required: false
    default: 'false'
  node-architecture:
    description: Optional Node.js architecture override for emulation certification.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: ${{ env.PNPM_VERSION }}
    - name: Set up Node.js ${{ inputs.node-version }}
      if: inputs.node-architecture == ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Set up Node.js ${{ inputs.node-version }} (${{ inputs.node-architecture }})
      if: inputs.node-architecture != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        architecture: ${{ inputs.node-architecture }}
        cache: pnpm
    - name: Install the frozen workspace
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Compile the native POSIX PTY binding
      if: runner.os != 'Windows' && inputs.compile-native-pty == 'true'
      shell: bash
      working-directory: packages/pty
      run: |
        node_root="$(node -p 'require("node:path").dirname(require("node:path").dirname(process.execPath))')"
        test -f "$node_root/include/node/node.h"
        pnpm exec node-gyp rebuild --nodedir="$node_root"
