name: Set up the JavaScript workspace
description: Install the pinned pnpm release, select Node, restore its pnpm cache and install the lockfile.

inputs:
  node-version:
    description: Supported Node.js major to install.
    required: false
    default: '22'
  compile-native-pty:
    description: Compile the host POSIX PTY addon for jobs that launch terminals.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: ${{ env.PNPM_VERSION }}
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Install the frozen workspace
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Compile the native POSIX PTY binding
      if: runner.os != 'Windows' && inputs.compile-native-pty == 'true'
      shell: bash
      working-directory: packages/pty
      run: pnpm exec node-gyp rebuild
