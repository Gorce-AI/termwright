name: Node host reliability certification

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      cycles:
        description: Complete terminal lifecycle cycles (certifying minimum 250)
        required: false
        default: '250'

permissions:
  contents: read

env:
  PNPM_VERSION: '9.4.0'
  TERMWRIGHT_RETRIES: '0'
  TERMWRIGHT_REQUIRE_FIRST_WORKFLOW_ATTEMPT: '1'
  TERMWRIGHT_UPDATE_SNAPSHOTS: 'none'

jobs:
  pty-native-build-x64:
    name: build nightly Windows PTY addon (x64)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile the addon
        working-directory: packages/pty
        run: |
          pnpm exec node-gyp rebuild --arch=x64
          node ../../scripts/stage-vendored-conpty.mjs --architecture x64 --destination build/Release/vendor
      - name: Place the binary in its prebuild package
        shell: bash
        run: |
          set -euo pipefail
          cp packages/pty/build/Release/termwright_pty.node \
             packages/pty-win32-x64/termwright_pty.node
          node scripts/check-prebuild.mjs win32 x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-pty-addon-x64
          path: packages/pty-win32-x64
          if-no-files-found: error
          retention-days: 1

  trace-streaming:
    name: bounded trace streaming
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @termwright/trace build
      - name: Measure bounded steady-state and finalization RSS
        shell: bash
        run: node --expose-gc scripts/certify-trace-streaming.mjs > trace-streaming.json
      - name: Upload trace resource evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trace-streaming-${{ matrix.os }}-node-${{ matrix.node }}
          path: trace-streaming.json
          if-no-files-found: error
          retention-days: 30

  nightly-soak-posix:
    name: nightly terminal lifecycle soak
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    # This soak exercises Termwright's Node/Vitest host against native PTYs.
    # Bun application execution is independently mandatory in CI's full
    # catalogue/OpenTUI rows and in the real OpenTUI performance workload;
    # installing Bun here would not make this Node host execute under Bun.
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile the native POSIX PTY binding
        working-directory: packages/pty
        run: pnpm exec node-gyp rebuild
      - run: pnpm build
      - name: Reuse one native host across every lifecycle cycle
        shell: bash
        env:
          TERMWRIGHT_RETRIES: '0'
          REQUESTED_CYCLES: ${{ inputs.cycles }}
        run: |
          set -euo pipefail
          cycles=$(node scripts/resolve-reliability-cycles.mjs "$REQUESTED_CYCLES")
          pnpm test -- --runs "$cycles" --resource-profile ci --json -- \
            --config quality/soak/vitest.config.ts --run quality/soak/terminal-cycle.test.ts

      - name: Upload Termwright failure evidence
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/upload-termwright-runs
        with:
          artifact-name: nightly-termwright-runs-${{ matrix.os }}-node-${{ matrix.node }}

  nightly-soak-windows:
    name: nightly terminal lifecycle soak
    needs: pty-native-build-x64
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nightly-pty-addon-x64
          path: packages/pty-win32-x64
      - run: pnpm build
      - name: Confirm the native backend is available
        shell: bash
        run: node scripts/check-prebuild.mjs win32 x64
      - name: Reuse one native host across every lifecycle cycle
        shell: bash
        env:
          TERMWRIGHT_RETRIES: '0'
          REQUESTED_CYCLES: ${{ inputs.cycles }}
        run: |
          set -euo pipefail
          cycles=$(node scripts/resolve-reliability-cycles.mjs "$REQUESTED_CYCLES")
          pnpm test -- --runs "$cycles" --resource-profile windows-ci --json -- \
            --config quality/soak/vitest.config.ts --run quality/soak/terminal-cycle.test.ts
      - name: Upload Termwright failure evidence
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/upload-termwright-runs
        with:
          artifact-name: nightly-termwright-runs-windows-latest-node-${{ matrix.node }}
