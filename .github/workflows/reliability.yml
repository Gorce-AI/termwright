name: Reliability certification

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      cycles:
        description: Complete terminal lifecycle cycles
        required: false
        default: '250'

permissions:
  contents: read

env:
  PNPM_VERSION: '9.4.0'
  TERMWRIGHT_RETRIES: '0'
  TERMWRIGHT_REQUIRE_FIRST_WORKFLOW_ATTEMPT: '1'
  TERMWRIGHT_UPDATE_SNAPSHOTS: 'none'

jobs:
  conpty-native-build-x64:
    name: build nightly ConPTY addon (x64)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile the addon
        working-directory: packages/conpty
        run: pnpm exec node-gyp rebuild --arch=x64
      - name: Place the binary in its prebuild package
        shell: bash
        run: |
          set -euo pipefail
          cp packages/conpty/build/Release/termwright_conpty.node \
             packages/conpty-win32-x64/termwright_conpty.node
          node scripts/check-prebuild.mjs x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-conpty-addon-x64
          path: packages/conpty-win32-x64/termwright_conpty.node
          if-no-files-found: error
          retention-days: 1

  nightly-soak-posix:
    name: nightly terminal lifecycle soak
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build
      - name: Reuse one native host across every lifecycle cycle
        shell: bash
        env:
          TERMWRIGHT_RETRIES: '0'
          REQUESTED_CYCLES: ${{ inputs.cycles }}
        run: |
          set -euo pipefail
          cycles=${REQUESTED_CYCLES:-250}
          case "$cycles" in (*[!0-9]*|'') echo "cycles must be a positive integer"; exit 2;; esac
          if (( cycles < 1 || cycles > 10000 )); then echo "cycles must be 1..10000"; exit 2; fi
          pnpm test -- --runs "$cycles" --resource-profile ci --json -- \
            --config quality/soak/vitest.config.ts --run quality/soak/terminal-cycle.test.ts

      - name: Upload Termwright failure evidence
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-termwright-runs-${{ matrix.os }}-node-${{ matrix.node }}
          path: .termwright/runs
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  nightly-soak-windows:
    name: nightly terminal lifecycle soak
    needs: conpty-native-build-x64
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nightly-conpty-addon-x64
          path: packages/conpty-win32-x64
      - name: Confirm the native backend is available
        shell: bash
        run: node scripts/check-prebuild.mjs x64
      - name: Reuse one native host across every lifecycle cycle
        shell: bash
        env:
          TERMWRIGHT_RETRIES: '0'
          REQUESTED_CYCLES: ${{ inputs.cycles }}
        run: |
          set -euo pipefail
          cycles=${REQUESTED_CYCLES:-250}
          case "$cycles" in (*[!0-9]*|'') echo "cycles must be a positive integer"; exit 2;; esac
          if (( cycles < 1 || cycles > 10000 )); then echo "cycles must be 1..10000"; exit 2; fi
          pnpm test -- --runs "$cycles" --resource-profile windows-ci --json -- \
            --config quality/soak/vitest.config.ts --run quality/soak/terminal-cycle.test.ts
      - name: Upload Termwright failure evidence
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-termwright-runs-windows-latest-node-${{ matrix.node }}
          path: .termwright/runs
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
          retention-days: 7
