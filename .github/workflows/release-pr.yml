name: Release PR

# Step 1 of a release. Applies the pending changesets on a branch and opens
# (or force-updates) the Version PR. Publishes nothing.
#
# Manual by policy: nothing in this repository publishes on a push.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Branch to prepare a release for'
        required: true
        default: main
        type: choice
        options:
          - main
          - release/0.x
          - release/1.x

concurrency:
  group: release-pr-${{ inputs.target }}
  # Never cancel: a half-applied `changeset version` on the release branch is
  # worse than a queued run. GitHub keeps one pending run per group.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: prepare ${{ inputs.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: '9.4.0'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply the changesets
        shell: bash
        run: |
          shopt -s nullglob
          changesets=(.changeset/*.md)
          pending=()
          for changeset in "${changesets[@]}"; do
            [[ "$changeset" == ".changeset/README.md" ]] || pending+=("$changeset")
          done

          if (( ${#pending[@]} == 0 )); then
            echo "No unreleased changesets found; the Version PR is already current."
          else
            pnpm changeset version
          fi
        env:
          # @changesets/changelog-github resolves authors and pull requests
          # while rendering changelog entries. The workflow token already has
          # the read access it needs; expose it to that process explicitly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The protocol version spans npm, Python and three Rust manifests.
      # `changeset version` moves the npm source of truth; this moves the rest,
      # so the Version PR is reviewable as one coherent bump rather than
      # something a later job repairs.
      - name: Propagate the protocol version
        run: |
          node scripts/sync-protocol-version.mjs
          node scripts/sync-protocol-version.mjs --check

      - name: Refresh the lockfile
        run: pnpm install --lockfile-only

      - name: Summarise what this release contains
        shell: bash
        run: |
          # shellcheck disable=SC2016  # backticks and $ inside single quotes are literal markdown
          {
            echo "## Release PR for \`${{ inputs.target }}\`"
            echo
            echo '### Versions after applying the changesets'
            echo
            echo '| Package | Version |'
            echo '|---|---|'
            node -e '
              const {readdirSync, readFileSync} = require("node:fs");
              for (const dir of readdirSync("packages")) {
                const pkg = JSON.parse(readFileSync(`packages/${dir}/package.json`, "utf8"));
                if (pkg.private === true) continue;
                console.log(`| ${pkg.name} | ${pkg.version} |`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the Version PR
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ inputs.target }}
          branch: release-pr/${{ inputs.target }}
          # The action force-updates this branch on every run by design, which
          # is what we want: the Version PR is a derived artifact, and a rerun
          # after a late changeset must replace it rather than stack onto it.
          delete-branch: false
          commit-message: 'chore(release): version packages'
          title: 'chore(release): version packages (${{ inputs.target }})'
          labels: release
          body: |
            Generated by `release-pr.yml` from the changesets on `${{ inputs.target }}`.

            Review the versions and changelogs, then merge. **Merging publishes
            nothing** — run `tag.yml`, then the per-registry publish workflows,
            in the order documented in
            [RELEASING.md](https://github.com/gorce-ai/termwright/blob/main/RELEASING.md).

            Re-running the workflow force-pushes this branch.
