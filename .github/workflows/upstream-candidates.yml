name: Framework compatibility candidates

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      maximum:
        description: 'Maximum fairly interleaved unverified releases to process'
        type: number
        default: 16
      stream:
        description: 'Exact stream id, or openconsole-bootstrap for the pinned native bootstrap'
        type: string
        required: false

concurrency:
  group: framework-compatibility-daily
  cancel-in-progress: false

permissions: {}

env:
  GOTOOLCHAIN: local
  TERMWRIGHT_RETRIES: '0'
  TERMWRIGHT_REQUIRE_FIRST_WORKFLOW_ATTEMPT: '1'
  TERMWRIGHT_UPDATE_SNAPSHOTS: 'none'
  TERMWRIGHT_UPSTREAM_GO_VERSION: '1.25'

jobs:
  discovery:
    name: Discover every unverified published version
    if: github.event_name != 'workflow_dispatch' || inputs.stream != 'openconsole-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-candidates: ${{ steps.matrix.outputs.has-candidates }}
      has-windows-candidates: ${{ steps.matrix.outputs.has-windows-candidates }}
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.TERMWRIGHT_UPSTREAM_GO_VERSION }}

      - name: Start discovery from the trusted default-branch ledger
        shell: bash
        run: |
          mkdir -p upstream-candidates
          cp compatibility/certified-upstreams.json upstream-candidates/effective-ledger.json

      - name: Build bounded deterministic candidate registry
        env:
          MAXIMUM: ${{ inputs.maximum || '16' }}
          STREAM: ${{ inputs.stream || '' }}
        shell: bash
        run: |
          set -euo pipefail
          discovery_args=( \
            --ledger upstream-candidates/effective-ledger.json \
            --assessments compatibility/candidate-assessments.json \
            --max "$MAXIMUM" \
            --output upstream-candidates/candidate-registry.json \
          )
          if [ -n "$STREAM" ]; then discovery_args+=(--stream "$STREAM"); fi
          node scripts/discover-framework-candidates.mjs "${discovery_args[@]}"

      - id: matrix
        name: Export bounded matrix
        shell: bash
        run: |
          matrix="$(jq -c '{include: [.candidates | to_entries[] | if .value.frameworkId == "opentui" then {slot: .key, id: .value.id, ecosystem: .value.ecosystem, platform: "linux", runner: "ubuntu-latest"}, {slot: .key, id: .value.id, ecosystem: .value.ecosystem, platform: "macos", runner: "macos-latest"} elif .value.frameworkId == "tview" then {slot: .key, id: .value.id, ecosystem: .value.ecosystem, platform: "linux", runner: "ubuntu-latest"}, {slot: .key, id: .value.id, ecosystem: .value.ecosystem, platform: "windows", runner: "windows-latest"} else {slot: .key, id: .value.id, ecosystem: .value.ecosystem, platform: "linux", runner: "ubuntu-latest"} end]}' upstream-candidates/candidate-registry.json)"
          count="$(jq '.candidates | length' upstream-candidates/candidate-registry.json)"
          windows_count="$(jq '[.candidates[] | select(.frameworkId == "tview")] | length' upstream-candidates/candidate-registry.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then echo 'has-candidates=true' >> "$GITHUB_OUTPUT"; else echo 'has-candidates=false' >> "$GITHUB_OUTPUT"; fi
          if [ "$windows_count" -gt 0 ]; then echo 'has-windows-candidates=true' >> "$GITHUB_OUTPUT"; else echo 'has-windows-candidates=false' >> "$GITHUB_OUTPUT"; fi
          jq -r '"### Framework release discovery\n\nSelected: \(.candidates | length) / \(.totalPending); backlog: \(.backlog)."' upstream-candidates/candidate-registry.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: framework-candidate-result-registry
          path: upstream-candidates/candidate-registry.json
          if-no-files-found: error
          retention-days: 30

  openconsole-bootstrap:
    name: Build pinned patched OpenConsole and ConPTY
    if: github.event_name == 'workflow_dispatch' && inputs.stream == 'openconsole-bootstrap'
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild.exe was not found' }
          Split-Path -Parent $msbuild | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build exact patched source
        shell: pwsh
        run: ./scripts/build-vendored-conpty.ps1 -OutputDirectory "$env:RUNNER_TEMP/termwright-conpty-bootstrap"

      - name: Upload uncertified bootstrap binaries and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vendored-conpty-bootstrap
          path: ${{ runner.temp }}/termwright-conpty-bootstrap
          if-no-files-found: error
          retention-days: 7

  pty-native-build-x64:
    name: Build the candidate Windows PTY addon (x64)
    needs: discovery
    if: needs.discovery.outputs.has-windows-candidates == 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js-workspace
      - name: Compile the exact x64 addon
        working-directory: packages/pty
        run: |
          pnpm exec node-gyp rebuild --arch=x64
          node ../../scripts/stage-vendored-conpty.mjs --architecture x64 --destination build/Release/vendor
      - name: Place and verify the exact prebuild
        run: |
          set -euo pipefail
          cp packages/pty/build/Release/termwright_pty.node \
             packages/pty-win32-x64/termwright_pty.node
          node scripts/check-prebuild.mjs win32 x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-candidate-pty-addon-x64
          path: packages/pty-win32-x64
          if-no-files-found: error
          retention-days: 1

  certify:
    name: Certify ${{ matrix.id }} (${{ matrix.platform }})
    needs: [discovery, pty-native-build-x64]
    if: >-
      always() &&
      needs.discovery.result == 'success' &&
      needs.discovery.outputs.has-candidates == 'true' &&
      (needs.discovery.outputs.has-windows-candidates != 'true' || needs.pty-native-build-x64.result == 'success')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discovery.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TERMWRIGHT_REQUIRE_BUN: '1'
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: framework-candidate-result-registry
          path: upstream-candidates
      - name: Initialize red verdict before setup
        env:
          CANDIDATE_ID: ${{ matrix.id }}
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          CANDIDATE_SLOT: ${{ matrix.slot }}
        run: |
          node scripts/certify-framework-candidate.mjs \
            --initialize-only \
            --registry upstream-candidates/candidate-registry.json \
            --candidate "$CANDIDATE_ID" \
            --platform "$CANDIDATE_PLATFORM" \
            --output "candidate-verdict/verdict-$CANDIDATE_SLOT-$CANDIDATE_PLATFORM.json"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: matrix.platform == 'windows'
        with:
          name: upstream-candidate-pty-addon-x64
          path: packages/pty-win32-x64
      - name: Require the exact native Windows backend
        if: matrix.platform == 'windows'
        run: node scripts/check-prebuild.mjs win32 x64

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '9.4.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.TERMWRIGHT_UPSTREAM_GO_VERSION }}
          cache-dependency-path: clients/go/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned

      - name: Verify the certified Bun runtime
        run: bun --version
      - run: pnpm install --frozen-lockfile
      - name: Compile the native POSIX PTY binding
        if: matrix.platform != 'windows'
        working-directory: packages/pty
        run: pnpm exec node-gyp rebuild
      - run: python -m pip install -e 'clients/python[dev]'
      - run: pnpm build
      - if: matrix.ecosystem == 'rust'
        run: cargo fetch --locked --manifest-path clients/rust-ratatui/Cargo.toml

      - name: Certify artifact identity and behavioral conformance
        # A red typed verdict is retained below, but the job stays red. Product
        # incompatibility and certifier defects must never produce a successful
        # workflow conclusion.
        env:
          CANDIDATE_ID: ${{ matrix.id }}
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          CANDIDATE_SLOT: ${{ matrix.slot }}
        run: |
          node scripts/certify-framework-candidate.mjs \
            --registry upstream-candidates/candidate-registry.json \
            --candidate "$CANDIDATE_ID" \
            --platform "$CANDIDATE_PLATFORM" \
            --output "candidate-verdict/verdict-$CANDIDATE_SLOT-$CANDIDATE_PLATFORM.json"

      - name: Candidate summary
        if: always()
        env:
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          CANDIDATE_SLOT: ${{ matrix.slot }}
        run: |
          jq -r '"### \(.candidateId)\n\nState: **\(.state)**\n\n\(.detail)"' \
            "candidate-verdict/verdict-$CANDIDATE_SLOT-$CANDIDATE_PLATFORM.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          # Raw platform verdicts deliberately do not use the
          # `framework-verdict-*` prefix consumed by the trusted reconciler.
          # Only the conjunctive aggregate below may enter that namespace.
          name: framework-candidate-result-${{ matrix.slot }}-${{ matrix.platform }}
          path: candidate-verdict
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate platform verdicts
    needs: [discovery, certify]
    if: always() && needs.discovery.result == 'success' && needs.discovery.outputs.has-candidates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.TERMWRIGHT_UPSTREAM_GO_VERSION }}
          cache-dependency-path: clients/go/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: framework-candidate-result-registry
          path: upstream-candidates
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: framework-candidate-result-*
          path: platform-results

      - name: Require every platform and aggregate conjunctively
        run: |
          node scripts/aggregate-framework-candidate-verdicts.mjs \
            --registry upstream-candidates/candidate-registry.json \
            --inputs platform-results \
            --output candidate-verdict

      - name: Aggregate summary
        if: always()
        shell: bash
        run: |
          for verdict in candidate-verdict/verdict-*.json; do
            test -f "$verdict" || continue
            jq -r '"### \(.candidateId)\n\nAggregate state: **\(.state)**\n\n\(.detail)"' "$verdict" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: framework-verdict-aggregate
          path: candidate-verdict
          if-no-files-found: error
          retention-days: 30
