name: Finalize release

# Last step. Publishes the draft GitHub Release created by tag.yml — but only
# after checking that every registry actually has the artifacts, so the release
# notes never announce something a user cannot install.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release anchor tag (e.g. protocol/v0.2.0)'
        required: true
        type: string
      allow_partial:
        description: 'Publish the notes even if a registry is missing the version (say why in the release body)'
        required: true
        default: false
        type: boolean
      mark_latest:
        description: 'Mark this as the latest GitHub Release. Disable for a backport/older release line.'
        required: true
        default: true
        type: boolean

concurrency:
  group: finalize-release-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: release-tag
    permissions:
      contents: write # publish the draft release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.ref }}
          fetch-depth: 0

      - name: Bind the checkout to the exact anchor tag
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$REF" in protocol/v*) ;; *) echo "::error::invalid release anchor $REF"; exit 1 ;; esac
          tag_commit=$(git rev-parse "refs/tags/$REF^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error::checkout HEAD $head_commit is not tag $REF ($tag_commit)"
            exit 1
          fi
          if [ "$WORKFLOW_REF" != "refs/tags/$REF" ] || [ "$WORKFLOW_SHA" != "$tag_commit" ]; then
            echo "::error::dispatch this workflow itself on tag $REF"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Every registry must have this version
        id: check
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          ALLOW_PARTIAL: ${{ inputs.allow_partial }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/protocol/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          missing=()

          expected_ref="protocol/v$version"
          if [ "$REF" != "$expected_ref" ]; then
            echo "::error::expected immutable release anchor $expected_ref, got $REF"
            exit 1
          fi

          while IFS= read -r manifest; do
            private=$(node -p "require('./$manifest').private === true")
            [ "$private" = "true" ] && continue
            name=$(node -p "require('./$manifest').name")
            package_version=$(node -p "require('./$manifest').version")
            if ! npm view "$name@$package_version" version --json >/dev/null 2>&1; then
              missing+=("npm $name@$package_version")
            fi
          done < <(find packages -mindepth 2 -maxdepth 2 -name package.json -print | sort)

          pypi_code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/termwright/$version/json")
          [ "$pypi_code" = "200" ] || missing+=("PyPI termwright $version")

          for crate_name in termwright-protocol termwright-probe-ratatui termwright-ratatui; do
            crate_code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: termwright-release (github.com/gorce-ai/termwright)' \
              "https://crates.io/api/v1/crates/$crate_name/$version")
            [ "$crate_code" = "200" ] || missing+=("crates.io $crate_name $version")
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "all three registries have $version"
            echo "missing=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '::warning::missing: %s\n' "${missing[@]}"
          echo "missing=$(printf '%s; ' "${missing[@]}")" >> "$GITHUB_OUTPUT"

          if [ "$ALLOW_PARTIAL" != "true" ]; then
            echo "::error::not finalizing — publish the missing registries first, or re-run with allow_partial."
            exit 1
          fi

      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
          MISSING: ${{ steps.check.outputs.missing }}
          MARK_LATEST: ${{ inputs.mark_latest }}
        shell: bash
        run: |
          tag="protocol/v$VERSION"
          body_file="$RUNNER_TEMP/termwright-release-body.md"

          gh release view "$tag" --json body --jq .body > "$body_file"
          BODY_FILE="$body_file" node <<'NODE'
          const fs = require('node:fs');

          const file = process.env.BODY_FILE;
          const missing = (process.env.MISSING ?? '')
            .trim()
            .replace(/;\s*$/, '');
          const start = '<!-- termwright-partial-release:start -->';
          const end = '<!-- termwright-partial-release:end -->';
          const managed = /\n*<!-- termwright-partial-release:start -->[\s\S]*?<!-- termwright-partial-release:end -->\n*/g;
          const legacy = /\n*> \*\*Partial release\.\*\* Not yet available: [^\n]*\n*/g;

          let body = fs.readFileSync(file, 'utf8')
            .replace(managed, '\n\n')
            .replace(legacy, '\n\n')
            .trimEnd();

          if (missing.length > 0) {
            const banner = `${start}\n> **Partial release.** Not yet available: ${missing}\n${end}`;
            body = body.length > 0 ? `${body}\n\n${banner}` : banner;
          }

          fs.writeFileSync(file, body.length > 0 ? `${body}\n` : '');
          NODE

          gh release edit "$tag" --notes-file "$body_file"
          if [ "$MARK_LATEST" = "true" ]; then
            gh release edit "$tag" --draft=false --latest
          else
            gh release edit "$tag" --draft=false --latest=false
          fi
          echo "published release notes for $tag"

      - name: Summary
        if: always()
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          MISSING: ${{ steps.check.outputs.missing }}
          MARK_LATEST: ${{ inputs.mark_latest }}
        run: |
          summary_ref=$(printf '%s' "$REF" | tr '\r\n' '  ')
          # shellcheck disable=SC2016  # backticks and $ inside single quotes are literal markdown
          {
            echo "## Finalized — $summary_ref"
            echo
            if [ "$CHECK_OUTCOME" != "success" ]; then
              echo 'Finalization checks failed; the release notes were not published.'
              if [ -n "$MISSING" ]; then
                printf 'Missing: `%s`\n' "$MISSING"
              fi
            elif [ -n "$MISSING" ]; then
              printf 'Published as a **partial** release. Missing: `%s`\n' "$MISSING"
            else
              echo 'All three registries confirmed.'
            fi
            if [ "$CHECK_OUTCOME" = "success" ]; then
              printf 'Marked as latest GitHub Release: `%s`\n' "$MARK_LATEST"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
