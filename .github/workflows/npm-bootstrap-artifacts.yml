name: npm bootstrap artifacts
run-name: npm bootstrap artifacts @ ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact current default-branch SHA'
        required: true
        type: string

concurrency:
  group: npm-bootstrap-artifacts
  cancel-in-progress: false

permissions:
  contents: read

env:
  TERMWRIGHT_RETRIES: '0'
  TERMWRIGHT_REQUIRE_FIRST_WORKFLOW_ATTEMPT: '1'
  TERMWRIGHT_UPDATE_SNAPSHOTS: 'none'

jobs:
  authorize:
    name: authorize reviewed bootstrap scope
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.authorize.outputs.commit }}
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact current default-branch SHA
        id: authorize
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          default_branch=$(gh api "/repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          test "$GITHUB_REF_NAME" = "$default_branch"
          current=$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$default_branch" --jq '.object.sha')
          test "$current" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "commit=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Require exactly the reviewed eleven missing npm names
        run: node scripts/check-npm-release-readiness.mjs --expect-missing scripts/npm-bootstrap-packages.json

  seal:
    name: pack and seal registry bootstrap placeholders
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '9.4.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Reconfirm registry scope immediately before sealing
        run: node scripts/check-npm-release-readiness.mjs --expect-missing scripts/npm-bootstrap-packages.json
      - name: Pack dependency-free prerelease placeholders outside the latest tag
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.commit }}
        run: pnpm pack:npm-artifacts -- --artifact-mode bootstrap-placeholders --output bootstrap/npm --package-list scripts/npm-bootstrap-packages.json --manifest bootstrap/bootstrap-manifest.json --source-sha "$SOURCE_SHA"
      - name: Seal and independently verify inventory
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.commit }}
        run: |
          set -euo pipefail
          cp docs/maintainers/npm-package-bootstrap.md bootstrap/OWNER-CHECKLIST.md
          node scripts/verify-npm-bootstrap-artifacts.mjs bootstrap --expected-sha "$SOURCE_SHA"
          (cd bootstrap && find npm bootstrap-manifest.json OWNER-CHECKLIST.md -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd bootstrap && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-bootstrap-artifacts-${{ needs.authorize.outputs.commit }}
          path: bootstrap
          if-no-files-found: error
          retention-days: 7
