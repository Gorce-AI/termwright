name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'packages/**'
      - 'scripts/generate-*-docs.mjs'
      - 'scripts/prepare-api-docs.mjs'
      - 'scripts/check-package-metadata.mjs'
      - 'typedoc*.json'
      - 'docs/DOCUMENTATION_GUIDE.md'
      - 'examples/getting-started/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'assets/brand/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'packages/**'
      - 'scripts/generate-*-docs.mjs'
      - 'scripts/prepare-api-docs.mjs'
      - 'scripts/check-package-metadata.mjs'
      - 'typedoc*.json'
      - 'docs/DOCUMENTATION_GUIDE.md'
      - 'examples/getting-started/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'assets/brand/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '9.4.0'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - run: pnpm install --frozen-lockfile

      - name: Check package metadata
        run: pnpm check:package-metadata

      - name: Check generated prose is current
        run: pnpm check:generated-docs

      - name: Check generated API reference is current
        shell: bash
        run: |
          set -euo pipefail
          pnpm docs:api
          git diff --exit-code -- website/src/content/docs/api

      # `base` in astro.config.mjs is '/termwright', matching
      # https://gorce-ai.github.io/termwright/.
      # TODO(custom domain): when a custom domain is configured, drop `base`
      # there, set `site` to the domain, and add website/public/CNAME.
      - run: pnpm --filter @termwright/website run check
      - run: pnpm --filter @termwright/website run build

      - name: Check internal links resolve inside the base path
        run: pnpm --filter @termwright/website run check:links

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/dist

  deploy:
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    # Build validation is safe to parallelize across pull requests. Only the
    # mutable Pages deployment is globally serialized and never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
