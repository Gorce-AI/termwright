name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/DOCUMENTATION_GUIDE.md'
      - 'examples/getting-started/**'
      - 'packages/ui/scripts/capture-docs-screenshots.mjs'
      - 'packages/ui/src/app/docs-screenshots.e2e.ts'
      - 'package.json'
      - 'assets/brand/**'
      - 'packages/ui/src/app/termwright-icon.svg'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# One deployment at a time; never cancel a running one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '9.4.0'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - run: pnpm install --frozen-lockfile

      # `base` in astro.config.mjs is '/termwright', matching
      # https://gorce-ai.github.io/termwright/.
      # TODO(custom domain): when a custom domain is configured, drop `base`
      # there, set `site` to the domain, and add website/public/CNAME.
      - run: pnpm --filter @termwright/website run check
      - run: pnpm --filter @termwright/website run build

      - name: Check internal links resolve inside the base path
        run: pnpm --filter @termwright/website run check:links

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
