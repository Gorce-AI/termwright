name: Publish — crates.io

# Manual, approved, checked out at a tag. First of the three registries:
# crates.io -> PyPI -> npm. It goes first because it is the least reversible —
# a crates.io release cannot be replaced, only yanked, and a yank is not a fix.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish from (e.g. protocol/v0.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Package and verify, publish nothing'
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-crate-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify ${{ inputs.ref }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.ref }}
          fetch-depth: 0

      - name: Bind the checkout to the exact anchor tag
        id: source
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$REF" in protocol/v*) ;; *) echo "::error::invalid release anchor $REF"; exit 1 ;; esac
          tag_commit=$(git rev-parse "refs/tags/$REF^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error::checkout HEAD $head_commit is not tag $REF ($tag_commit)"
            exit 1
          fi
          if [ "$WORKFLOW_REF" != "refs/tags/$REF" ] || [ "$WORKFLOW_SHA" != "$tag_commit" ]; then
            echo "::error::dispatch this workflow itself on tag $REF so registry identity names the verified source"
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The tag must agree with the manifests
        id: version
        working-directory: clients/rust
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | node -e "
            const meta = JSON.parse(require('node:fs').readFileSync(0, 'utf8'));
            const crate = meta.packages.find((p) => p.name === 'termwright-protocol');
            if (!crate) { console.error('termwright-protocol not found in cargo metadata'); process.exit(1); }
            console.log(crate.version);
          ")
          echo "value=$version" >> "$GITHUB_OUTPUT"

          ref=$REF
          case "$ref" in
            protocol/v*)
              tagged="${ref#protocol/v}"
              if [ "$tagged" != "$version" ]; then
                echo "::error::tag says $tagged, clients/rust/Cargo.toml says $version"
                exit 1
              fi
              ;;
            *)
              echo "::error::$ref is not the immutable protocol/vX.Y.Z release anchor"
              exit 1
              ;;
          esac

      - run: node scripts/sync-protocol-version.mjs --check

      - name: Report crates that already exist
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for crate in termwright-protocol termwright-probe-ratatui termwright-ratatui; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: termwright-release (github.com/gorce-ai/termwright)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$code" = "200" ]; then
              echo "::notice::$crate $VERSION already exists — its publish step will skip."
            else
              echo "$crate $VERSION still needs publishing"
            fi
          done

      - name: Test and package
        run: |
          cargo test --locked --manifest-path clients/rust/Cargo.toml
          TERMWRIGHT_REQUIRE_RATATUI=1 cargo test --locked --manifest-path clients/rust-probe/Cargo.toml
          cargo test --locked --manifest-path clients/rust-ratatui/Cargo.toml

          # The local registry patches are resolution-only. Cargo still packs
          # normalized version dependencies, then verifies the exact extracted
          # crate against these already-tested local versions.
          cargo package --locked --manifest-path clients/rust/Cargo.toml
          cargo package --locked --manifest-path clients/rust-probe/Cargo.toml \
            --config "patch.crates-io.termwright-protocol.path='$GITHUB_WORKSPACE/clients/rust'"
          cargo package --locked --manifest-path clients/rust-ratatui/Cargo.toml \
            --config "patch.crates-io.termwright-protocol.path='$GITHUB_WORKSPACE/clients/rust'" \
            --config "patch.crates-io.termwright-probe-ratatui.path='$GITHUB_WORKSPACE/clients/rust-probe'"

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-publish
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}

      - uses: dtolnay/rust-toolchain@stable

      # crates.io trusted publishing. It refuses OIDC from pull_request_target
      # and workflow_run triggers, which is one more reason this workflow is
      # dispatch-only.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail

          # Dependency order is part of the release contract. Cargo waits for
          # each upload to reach the index before returning, so the next crate
          # can resolve the exact registry version it declares.
          crates=(
            'termwright-protocol:clients/rust/Cargo.toml'
            'termwright-probe-ratatui:clients/rust-probe/Cargo.toml'
            'termwright-ratatui:clients/rust-ratatui/Cargo.toml'
          )

          for entry in "${crates[@]}"; do
            name=${entry%%:*}
            manifest=${entry#*:}
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: termwright-release (github.com/gorce-ai/termwright)' \
              "https://crates.io/api/v1/crates/$name/$VERSION")
            if [ "$code" = "200" ]; then
              echo "::notice::$name $VERSION already exists — skipping"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              # Patch only dependency resolution for the coordinated dry run:
              # on a first release the preceding exact version does not exist
              # in crates.io yet. Cargo still produces the normalized upload
              # manifest with registry version dependencies; no path enters the
              # crate artifact. A real publish below never uses these patches.
              case "$name" in
                termwright-protocol)
                  cargo publish --locked --manifest-path "$manifest" --dry-run
                  ;;
                termwright-probe-ratatui)
                  cargo publish --locked --manifest-path "$manifest" --dry-run \
                    --config "patch.crates-io.termwright-protocol.path='$GITHUB_WORKSPACE/clients/rust'"
                  ;;
                termwright-ratatui)
                  cargo publish --locked --manifest-path "$manifest" --dry-run \
                    --config "patch.crates-io.termwright-protocol.path='$GITHUB_WORKSPACE/clients/rust'" \
                    --config "patch.crates-io.termwright-probe-ratatui.path='$GITHUB_WORKSPACE/clients/rust-probe'"
                  ;;
              esac
            else
              # The verify job already built and tested this exact tree.
              cargo publish --locked --manifest-path "$manifest" --no-verify
            fi
          done

      - name: Summary
        if: always()
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          VERSION: ${{ needs.verify.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          summary_ref=$(printf '%s' "$REF" | tr '\r\n' '  ')
          # shellcheck disable=SC2016 # backticks are literal Markdown
          {
            echo "## crates.io — $summary_ref"
            echo
            printf 'coordinated Rust version: `%s`  ·  dry run: `%s`\n' "$VERSION" "$DRY_RUN"
            echo
            echo '`termwright-protocol` → `termwright-probe-ratatui` → `termwright-ratatui`'
            echo
            echo 'A crates.io release cannot be replaced. If this failed after the upload landed, do not yank — ship the next patch.'
          } >> "$GITHUB_STEP_SUMMARY"
