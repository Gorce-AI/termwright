name: Publish — PyPI

# Manual, approved, checked out at a tag. Second of the three registries:
# crates.io -> PyPI -> npm (see RELEASING.md).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish from (e.g. protocol/v0.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and check the distribution, upload nothing'
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-pypi-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify ${{ inputs.ref }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      published: ${{ steps.published.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.ref }}
          fetch-depth: 0

      - name: Bind the checkout to the exact anchor tag
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$REF" in protocol/v*) ;; *) echo "::error::invalid release anchor $REF"; exit 1 ;; esac
          tag_commit=$(git rev-parse "refs/tags/$REF^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error::checkout HEAD $head_commit is not tag $REF ($tag_commit)"
            exit 1
          fi
          if [ "$WORKFLOW_REF" != "refs/tags/$REF" ] || [ "$WORKFLOW_SHA" != "$tag_commit" ]; then
            echo "::error::dispatch this workflow itself on tag $REF so PyPI attestations name the verified source"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The tag must agree with the manifests
        id: version
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('clients/python/pyproject.toml').read_text())['project']['version'])")
          echo "value=$version" >> "$GITHUB_OUTPUT"

          expected_ref="protocol/v$version"
          if [ "$REF" != "$expected_ref" ]; then
            echo "::error::expected immutable release anchor $expected_ref, got $REF"
            exit 1
          fi

      # The Python client shares the protocol's version with the npm package,
      # all three Rust crates and the Go module. A drift here means the tag is
      # lying about what it contains.
      - run: node scripts/sync-protocol-version.mjs --check

      - name: Is this version already on PyPI?
        id: published
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/termwright/$VERSION/json")
          if [ "$code" = "200" ]; then
            echo "::notice::termwright $VERSION is already on PyPI — the publish job will skip."
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check the distribution
        working-directory: clients/python
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Test the built package
        working-directory: clients/python
        shell: bash
        run: |
          set -euo pipefail
          test_env="$RUNNER_TEMP/termwright-wheel-test"
          python -m venv "$test_env"
          wheel=$(find dist -maxdepth 1 -name 'termwright-*.whl' -print -quit)
          test -n "$wheel"
          "$test_env/bin/pip" install "$wheel" pytest pytest-asyncio 'textual>=0.60'
          "$test_env/bin/python" -c "import termwright; assert '/site-packages/' in termwright.__file__.replace('\\\\', '/')"
          "$test_env/bin/python" -m pytest

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: clients/python/dist
          retention-days: 7

  publish:
    name: publish to PyPI
    needs: verify
    # Already-published is a normal state when re-dispatching after a partial
    # failure: skip, never re-upload, never yank.
    if: needs.verify.outputs.published == 'false'
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist

      - name: Publish
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Dry run — what would have been uploaded
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          echo "dry run: not uploading. Contents of dist/:"
          ls -l dist

      - name: Summary
        if: always()
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          VERSION: ${{ needs.verify.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          summary_ref=$(printf '%s' "$REF" | tr '\r\n' '  ')
          # shellcheck disable=SC2016 # backticks are literal Markdown
          {
            echo "## PyPI — $summary_ref"
            echo
            printf 'version: `%s`  ·  dry run: `%s`\n' "$VERSION" "$DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"
