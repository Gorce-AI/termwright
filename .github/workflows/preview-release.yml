name: Preview release

# Installable builds of a pull request, published to pkg-pr-new rather than to
# npm. Nothing here touches the real registry, and no version is consumed.
#
# Opt-in per PR: first install the pkg-pr-new GitHub App for this repository,
# then add the `pr preview` label. The service rejects publication when its app
# is absent, so the label is an assertion that this repository prerequisite is
# already satisfied. A preview of every PR would be noise, and a preview built
# from an unreviewed fork is not something to hand people a one-line install
# command for by default.
# `pr preview artifacts` is the registry-independent channel: it produces one
# sealed downloadable bundle and never calls the hosted publishing service.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prebuilds:
    if: contains(github.event.pull_request.labels.*.name, 'pr preview') || contains(github.event.pull_request.labels.*.name, 'pr preview artifacts')
    name: preview PTY prebuild (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: win32, arch: x64, runner: windows-2022 }
          - { platform: win32, arch: arm64, runner: windows-11-arm }
          - { platform: linux, arch: x64, runner: ubuntu-22.04 }
          - { platform: linux, arch: arm64, runner: ubuntu-22.04-arm }
          - { platform: darwin, arch: x64, runner: macos-15-intel, macos_target: '13.5' }
          - { platform: darwin, arch: arm64, runner: macos-15, macos_target: '13.5' }
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '9.4.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.platform == 'win32'
        with:
          bun-version: '1.4.0'
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/build-pty-prebuild
        with:
          platform: ${{ matrix.platform }}
          architecture: ${{ matrix.arch }}
          macos-deployment-target: ${{ matrix.macos_target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-pty-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/pty-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  certify-x64-on-arm64:
    if: contains(github.event.pull_request.labels.*.name, 'pr preview') || contains(github.event.pull_request.labels.*.name, 'pr preview artifacts')
    name: certify preview PTY x64 on Windows ARM64
    needs: prebuilds
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '9.4.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          architecture: x64
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-windows-x64.zip
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: preview-pty-win32-x64
          path: packages/pty-win32-x64
      - run: pnpm --filter @termwright/pty build
      - name: Exercise the exact preview x64 bundle under emulation
        shell: bash
        env:
          TERMWRIGHT_REQUIRE_BUN: '1'
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/termwright-preview-x64-packs"
          install_dir="$RUNNER_TEMP/termwright-preview-x64-install"
          mkdir -p "$pack_dir" "$install_dir"
          node scripts/check-prebuild.mjs win32 x64
          pnpm --dir packages/pty-win32-x64 pack --pack-destination "$pack_dir"
          pnpm --dir packages/pty pack --pack-destination "$pack_dir"
          npm install --prefix "$install_dir" "$pack_dir"/*.tgz
          node scripts/check-installed-pty.mjs "$install_dir" --verdict packages/pty-win32-x64/certification-verdict-arm64-host.json
          node scripts/verify-windows-pty-verdict.mjs packages/pty-win32-x64 certification-verdict-arm64-host.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-pty-win32-x64-arm64-host-verdict
          path: packages/pty-win32-x64/certification-verdict-arm64-host.json
          if-no-files-found: error
          retention-days: 1

  preview:
    if: contains(github.event.pull_request.labels.*.name, 'pr preview') || contains(github.event.pull_request.labels.*.name, 'pr preview artifacts')
    needs: [prebuilds, certify-x64-on-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Parent identity is part of the artifact contract. A depth-one
          # checkout marks the synthetic merge as shallow and hides `%P`.
          fetch-depth: 2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '9.4.0'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: preview-pty-*
          path: preview-prebuilds
      - name: Install the exact preview prebuild bundles
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            if [[ "$target" == win32-* ]]; then
              node scripts/verify-windows-pty-verdict.mjs "preview-prebuilds/preview-pty-$target"
            fi
            cp "preview-prebuilds/preview-pty-$target/termwright_pty.node" "packages/pty-$target/termwright_pty.node"
            if [[ "$target" == win32-* ]]; then
              rm -rf "packages/pty-$target/vendor"
              cp -R "preview-prebuilds/preview-pty-$target/vendor" "packages/pty-$target/vendor"
            fi
          done
          node scripts/check-prebuild.mjs --all
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: preview-pty-win32-x64-arm64-host-verdict
          path: preview-prebuilds/preview-pty-win32-x64
      - name: Verify the exact x64 preview bundle on native ARM64 Windows
        run: node scripts/verify-windows-pty-verdict.mjs preview-prebuilds/preview-pty-win32-x64 certification-verdict-arm64-host.json
      - run: pnpm build

      - name: Pack and seal the downloadable preview
        shell: bash
        env:
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          for commit in "$MERGE_SHA" "$HEAD_SHA" "$BASE_SHA"; do
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          done
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          read -r merge_base merge_head extra < <(git show -s --format=%P HEAD)
          test -z "${extra:-}"
          test "$merge_base" = "$BASE_SHA"
          test "$merge_head" = "$HEAD_SHA"
          mkdir -p preview
          pnpm pack:npm-artifacts -- --output preview/npm --manifest preview/npm-manifest.json --source-sha "$MERGE_SHA"
          node -e 'const fs = require("node:fs"); fs.writeFileSync("preview/build-identity.json", JSON.stringify({schemaVersion: 1, mergeCommit: process.env.MERGE_SHA, headCommit: process.env.HEAD_SHA, baseCommit: process.env.BASE_SHA}, null, 2) + "\n")'
          install_dir="$RUNNER_TEMP/termwright-preview-driver"
          mkdir -p "$install_dir"
          npm install --prefix "$install_dir" \
            preview/npm/termwright-protocol-*.tgz \
            preview/npm/termwright-vt-*.tgz \
            preview/npm/termwright-pty-linux-x64-*.tgz \
            preview/npm/termwright-pty-[0-9]*.tgz \
            preview/npm/termwright-driver-*.tgz
          node scripts/check-installed-driver.mjs "$install_dir"
          (cd preview && find npm npm-manifest.json build-identity.json -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd preview && sha256sum --check SHA256SUMS)

      - name: Upload the sealed downloadable preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-npm-${{ github.sha }}
          path: preview
          if-no-files-found: error
          retention-days: 7

      # pkg-pr-new serves each package straight from the build, so a reviewer
      # installs the PR with `npm i https://pkg.pr.new/@termwright/driver@<pr>`.
      - if: contains(github.event.pull_request.labels.*.name, 'pr preview')
        run: pnpm dlx pkg-pr-new@0.0.88 publish --pnpm './packages/*'
