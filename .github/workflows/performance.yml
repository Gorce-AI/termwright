name: Performance observations

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Observe against the committed baseline or capture a reviewed candidate
        required: true
        default: observe
        type: choice
        options:
          - observe
          - capture
      cycles:
        description: Complete lifecycle observations (2..100)
        required: false
        default: '10'

concurrency:
  group: performance-observations
  cancel-in-progress: false

permissions:
  contents: read

env:
  PNPM_VERSION: '9.4.0'
  PERFORMANCE_RUNNER_CLASS: 'darwin-arm64-node24-go1.25-bun1.2.15'
  PERFORMANCE_BASELINE: 'packages/performance/baselines/darwin-arm64-node24-go1.25-bun1.2.15.json'
  PERFORMANCE_BASELINE_POLICY: 'packages/performance/baselines/darwin-arm64-node24-go1.25-bun1.2.15.policy.json'
  TERMWRIGHT_RETRIES: '0'
  TERMWRIGHT_REQUIRE_FIRST_WORKFLOW_ATTEMPT: '1'
  TERMWRIGHT_UPDATE_SNAPSHOTS: 'none'

jobs:
  observe:
    name: performance observations (annotate only)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Reject workflow reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the qualified baseline in normal observation mode
        if: github.event_name == 'schedule' || inputs.mode == 'observe'
        shell: bash
        run: test -f "$PERFORMANCE_BASELINE"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Bubble Tea v2 declares Go 1.25. The benchmark compares vanilla and
          # instrumented binaries built by this same qualified Go line, and the
          # runner descriptor records the exact resolved patch version.
          go-version: '1.25'
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.2.15'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: mkdir -p performance-results
      - name: Record and verify the toolchain-qualified runner class
        run: >-
          node scripts/performance-environment.mjs
          --class "$PERFORMANCE_RUNNER_CLASS" --runner macos-15
          --output performance-results/environment.json
      - name: Collect the semantic pipeline benchmark
        run: >-
          pnpm --filter @termwright/performance benchmark --iterations 1000 --warmup 100
          --nodes 96 --output "$GITHUB_WORKSPACE/performance-results/semantic-pipeline.json"
      - name: Collect the Charm E2E benchmark
        run: >-
          pnpm --filter @termwright/performance benchmark:charm --iterations 3
          --output "$GITHUB_WORKSPACE/performance-results/charm-immediate.json"
      - name: Collect the OpenTUI marker-route benchmark
        run: >-
          pnpm --filter @termwright/performance benchmark:opentui --repetitions 3
          --window-ms 1000 --output "$GITHUB_WORKSPACE/performance-results/opentui-marker-route.json"
      - name: Collect lifecycle and resource observations
        shell: bash
        env:
          REQUESTED_CYCLES: ${{ inputs.cycles }}
        run: |
          set -euo pipefail
          cycles=${REQUESTED_CYCLES:-10}
          case "$cycles" in (*[!0-9]*|'') echo "cycles must be a positive integer"; exit 2;; esac
          if (( cycles < 2 || cycles > 100 )); then echo "cycles must be 2..100"; exit 2; fi
          node scripts/collect-quality-performance.mjs \
            --cycles "$cycles" \
            --environment-file performance-results/environment.json \
            --output performance-results/quality.json
      - name: Capture a measured baseline candidate
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'capture'
        run: >-
          node scripts/capture-performance-baseline.mjs
          --policy "$PERFORMANCE_BASELINE_POLICY"
          --environment performance-results/environment.json
          --quality performance-results/quality.json
          --semantic performance-results/semantic-pipeline.json
          --charm performance-results/charm-immediate.json
          --opentui performance-results/opentui-marker-route.json
          --output "performance-results/baseline-candidate/$PERFORMANCE_RUNNER_CLASS.json"
      - name: Compare with the qualified recorded baseline
        if: github.event_name == 'schedule' || inputs.mode == 'observe'
        run: >-
          node scripts/compare-performance-baseline.mjs
          --baseline "$PERFORMANCE_BASELINE"
          --environment performance-results/environment.json
          --quality performance-results/quality.json
          --semantic performance-results/semantic-pipeline.json
          --charm performance-results/charm-immediate.json
          --opentui performance-results/opentui-marker-route.json
          --output performance-results/comparison.json
      - name: Upload measured baseline candidate and raw observations
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'capture'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-baseline-candidate-darwin-arm64-node24-go1.25-bun1.2.15
          path: |
            performance-results
            .termwright/runs
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Upload comparable observations
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'observe')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-observations-darwin-arm64-node24-go1.25-bun1.2.15
          path: |
            performance-results
            .termwright/runs
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
