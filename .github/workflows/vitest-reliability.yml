name: Vitest and PTY reliability evidence

on:
  schedule:
    - cron: '41 2 * * 3'
  workflow_dispatch: {}

concurrency:
  group: vitest-pty-reliability-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  windows-matrix:
    name: Windows Node ${{ matrix.node }} / Vitest pool matrix
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "${{ matrix.node }}" }
      - name: Run independent worker/PTY pressure matrix
        shell: bash
        run: node scripts/run-vitest-pty-matrix.mjs "$RUNNER_TEMP/vitest-pty-matrix.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: vitest-pty-matrix-node-${{ matrix.node }}
          path: ${{ runner.temp }}/vitest-pty-matrix.json
          if-no-files-found: error
          retention-days: 30
