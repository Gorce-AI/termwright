name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keep the pnpm store inside the workspace so actions/setup-node can cache it.
  PNPM_VERSION: '9.4.0'

jobs:
  build:
    name: build ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install test (the native pty binding resolves on this platform)
        shell: bash
        run: pnpm --filter @termwright/driver exec node -e "import('@lydell/node-pty').then(m => { if (typeof m.spawn !== 'function') process.exit(1); console.log('pty backend loaded'); })"

      - run: pnpm -r --filter './packages/*' run build
      - run: pnpm -r --filter './packages/*' run typecheck
      - run: pnpm -r --filter './packages/*' run test

  hostile:
    name: hostile input (128 MiB heap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build

      # These pin the worker's old-space to 128 MiB, so a resource-exhaustion
      # case fails closed instead of passing on a large default heap.
      - run: pnpm --filter @termwright/protocol run test:hostile
      - run: pnpm --filter @termwright/conformance run test:hostile

      # @termwright/ui has no hostile-specific vitest config: its suite states
      # the 128 MiB cap as a CI obligation, so CI is where the cap is applied.
      # Vitest workers inherit NODE_OPTIONS, which is what actually bounds them.
      - name: '@termwright/ui hostile suite'
        env:
          NODE_OPTIONS: '--max-old-space-size=128'
        run: pnpm --filter @termwright/ui exec vitest run src/hostile.test.ts

  conformance:
    name: conformance ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Every suite here spawns a process, a pty and a socket per test, so this
    # lane is minutes rather than seconds. The default 360 would hide a hang.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # The adapter-contract rows for Textual and tview drive real apps as
      # subprocesses. Without these toolchains those rows skip, and a skipped
      # certification is not a certification.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: clients/go/go.sum

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build

      - name: Install the Python client (Textual adapter row)
        run: pip install -e "clients/python[dev]"

      # Exits 0/1. Where no pty can be opened it skips everything and says so;
      # ubuntu and macOS have one, and Windows is the row to watch for ConPTY.
      # bash + pipefail on every OS: piping through `tee` in PowerShell would
      # report the pipe's status, turning a failed matrix into a green step.
      - name: Run the conformance matrix
        id: matrix
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @termwright/conformance run conformance | tee conformance-matrix.txt

      # Partial skips are reported as "pass, N skip", which is exactly the thing
      # that disappears in a green checkmark unless it is written down.
      - name: Publish the matrix to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Conformance matrix — ${{ matrix.os }}"
            echo
            echo '```'
            cat conformance-matrix.txt 2>/dev/null || echo "(the matrix produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ui-browser:
    name: runner UI end-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `vite build` produces dist/app, which the server serves. Without it the
      # browser would load nothing and every assertion would fail on an empty
      # page rather than on the thing under test.
      - run: pnpm -r --filter './packages/*' run build

      # `pnpm --filter X run <missing script>` exits 0. This job exists to run
      # one specific suite, so its absence has to be an error — otherwise the
      # lane goes green having opened no browser at all.
      - name: The browser suite must exist
        shell: bash
        run: |
          if ! node -e 'process.exit(require("./packages/ui/package.json").scripts?.["test:browser"] ? 0 : 1)'; then
            echo "::error::packages/ui has no test:browser script — this lane cannot verify anything."
            exit 1
          fi

      - name: Install Chromium
        run: pnpm --filter @termwright/ui exec playwright install --with-deps chromium

      # Asserts the three panes, the test list, time travel, the crash panel and
      # the log panel against a real browser driving a real server.
      - run: pnpm --filter @termwright/ui run test:browser

      - name: Upload the failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-artifacts
          path: |
            packages/ui/test-results
            packages/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  opentui:
    name: opentui adapter contract (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # OpenTUI loads its native Zig library through bun:ffi, so this suite
      # cannot run under Node at all. Without Bun on PATH it skips itself, and
      # CI would claim adapter coverage it does not have.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build
      - run: bun --version

      # Without the flag a missing precondition (no Bun, no dist/) skips the
      # suite, and vitest exits 0 on a skip — this job would go green without
      # running the tests it exists for. The flag turns that into a failure
      # naming the reason. Skipping stays the default on a developer machine.
      - run: pnpm --filter @termwright/opentui run test:conformance
        env:
          TERMWRIGHT_REQUIRE_CONFORMANCE: '1'

      # The injection suite runs each case twice, under Bun and under Node. On a
      # runner without Bun the Bun arms drop out (and the suite says so with an
      # explicit test), so this lane is the only place they execute at all.
      - run: pnpm --filter @termwright/probe-opentui run test

  clients:
    name: clients (${{ matrix.client }}${{ matrix.python && format(' {0}', matrix.python) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Python client declares >=3.9, so the floor is tested, not assumed.
        include:
          - client: python
            python: '3.9'
          - client: python
            python: '3.12'
          - client: go
          - client: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.client == 'python'
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-go@v5
        if: matrix.client == 'go'
        with:
          go-version: '1.23'
          cache-dependency-path: clients/go/go.sum

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.client == 'rust'

      # The toolchain is installed by the step above, so a missing one is a
      # setup failure rather than a reason to skip: no continue-on-error here.
      - name: Verify the toolchain is present
        run: |
          case "${{ matrix.client }}" in
            python) python --version ;;
            go)     go version ;;
            rust)   cargo --version ;;
          esac

      - name: Python tests
        if: matrix.client == 'python'
        working-directory: clients/python
        run: |
          pip install -e ".[dev]"
          pytest

      - name: Go tests
        if: matrix.client == 'go'
        working-directory: clients/go
        run: go test ./...

      - name: Rust tests
        if: matrix.client == 'rust'
        working-directory: clients/rust
        run: cargo test

  release-hygiene:
    name: release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # The protocol version is carried by four manifests in three languages.
      # They drift silently otherwise, and the first symptom is a release where
      # the crate and the npm package disagree about the wire format.
      - name: Protocol lockstep
        run: node scripts/sync-protocol-version.mjs --check

      - run: pnpm install --frozen-lockfile

      # A change to a published package without a changeset is a change that
      # ships with no changelog entry and no version bump. Release-only PRs are
      # exempt: `changeset version` consumes the files it was given.
      - name: A PR touching packages/** needs a changeset
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE" "$HEAD" -- 'packages/**' || true)
          if [ -z "$changed" ]; then
            echo "no packages/** changes — nothing to require"
            exit 0
          fi

          added=$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" -- '.changeset/*.md' \
            | grep -v '.changeset/README.md' || true)
          if [ -n "$added" ]; then
            echo "changeset present:"
            echo "$added"
            exit 0
          fi

          echo "::error::this PR changes packages/** but adds no changeset. Run \`pnpm changeset\`, or add the 'release' label if the change genuinely ships nothing (docs, tests, comments)."
          echo 'Changed files:'
          echo "$changed"
          exit 1

  rust-msrv:
    name: clients (rust MSRV 1.74)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Exactly the floor Cargo.toml declares. Testing on anything newer would
      # prove the wrong thing: the crate compiled on 1.82 while claiming 1.74 is
      # how a method stabilised in 1.82 reached a release unnoticed.
      - uses: dtolnay/rust-toolchain@1.74

      - name: The toolchain must be the declared floor
        working-directory: clients/rust
        shell: bash
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          actual=$(rustc --version | cut -d' ' -f2)
          echo "declared floor: $declared, toolchain: $actual"

          # Compare on major.minor only. A patch release is not a different
          # floor, and the toolchain action serves the newest patch in the
          # series — so a Cargo.toml that ever says "1.74.0" must not fail this
          # guard against a 1.74.1 runner with nothing actually wrong.
          minor() { echo "$1" | cut -d. -f1,2; }
          if [ "$(minor "$declared")" != "$(minor "$actual")" ]; then
            echo "::error::this job must run on $(minor "$declared").x, not $actual — pin the toolchain or raise rust-version"
            exit 1
          fi

      # Build, not test: MSRV is a promise to whoever *depends* on the crate,
      # and a dependent compiles the library. Compiling the test binaries would
      # drag dev-dependencies into the floor, so an unrelated crate raising its
      # own MSRV would fail this lane with nothing wrong on our side.
      - name: Build on the floor
        working-directory: clients/rust
        run: cargo build --locked

      # The tracing bridge is a documented option, so it is part of the promise.
      # If this step is what fails, the fix is to document that the feature needs
      # a newer Rust — not to quietly raise the floor for everyone.
      - name: Build with every feature
        working-directory: clients/rust
        run: cargo build --locked --all-features

  vectors:
    name: cross-language vectors are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @termwright/protocol run build

      # The generator re-runs every expectation through the reference
      # implementation, so a stale or hand-edited vector shows up as a diff.
      - run: node clients/test-vectors/generate.mjs
      - name: Fail if the committed vectors drifted
        run: git diff --exit-code -- clients/test-vectors

  examples:
    name: examples (dogfooding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: examples/tview-menu/go.sum

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build

      - name: Install the Python client for the Textual example
        run: pip install -e "clients/python[textual]"

      - run: pnpm -r --filter './examples/*' run test

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: example-termwright-reports
          path: examples/*/termwright-report
          if-no-files-found: ignore
          retention-days: 7

  website:
    name: website builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @termwright/website run build
      - run: pnpm --filter @termwright/website run check:links
