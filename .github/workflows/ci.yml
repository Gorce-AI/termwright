name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Keep the pnpm store inside the workspace so actions/setup-node can cache it.
  PNPM_VERSION: '9.4.0'

jobs:
  package-metadata:
    name: package metadata
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: node scripts/check-package-metadata.mjs
      - run: node scripts/check-platform-deviations.mjs
      - run: node scripts/audit-determinism-constructs.mjs
      - run: node scripts/generate-semantic-completeness.mjs
      - run: node scripts/generate-mission-completion.mjs

  build:
    name: build ${{ matrix.os }} / node ${{ matrix.node }}
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is absent on purpose. Its backend is a native addon, and a
        # row that runs before the addon is compiled would have nothing to run
        # on now that there is no fallback. The Windows rows live in
        # windows-driver-native, which waits for the prebuild.
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install test (the native pty binding resolves on this platform)
        shell: bash
        run: pnpm --filter @termwright/driver exec node -e "import('@lydell/node-pty').then(m => { if (typeof m.spawn !== 'function') process.exit(1); console.log('pty backend loaded'); })"

      - run: pnpm -r --filter './packages/*' run build
      # A bundled native dependency resolves its addon beside the wrong file,
      # and the only symptom is a silent fallback to the backend it replaces.
      - run: node scripts/check-optional-native-externals.mjs
      # The certification smoke imports the packed-shape driver entrypoint; a
      # fresh checkout has no dist/ and must build before this check. Running
      # it earlier accidentally depended on stale local artifacts.
      - run: pnpm check:node-pty
      - name: Verify packed driver on the native PTY backend
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/termwright-driver-packs"
          install_dir="$RUNNER_TEMP/termwright-driver-install"
          mkdir -p "$pack_dir" "$install_dir"
          pnpm --dir packages/protocol pack --pack-destination "$pack_dir"
          pnpm --dir packages/vt pack --pack-destination "$pack_dir"
          pnpm --dir packages/driver pack --pack-destination "$pack_dir"
          npm install --prefix "$install_dir" "$pack_dir"/*.tgz
          node scripts/check-installed-driver.mjs "$install_dir"
      - run: pnpm -r --filter './packages/*' run typecheck
      - name: Run the certified Termwright host
        shell: bash
        run: |
          set -euo pipefail
          profile=ci
          if [[ "${{ runner.os }}" == "Windows" ]]; then profile=windows-ci; fi
          pnpm test -- --resource-profile "$profile" --json

      # The Getting Started source is a real workspace package. This catches
      # stale imports, launch assumptions and expected output in the primary
      # documentation path on every supported Node/OS build row.
      - name: Run the Getting Started example
        run: pnpm test -- --resource-profile ci --json -- --run examples/getting-started

  hostile:
    name: hostile input (128 MiB heap)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build

      # Hostile suites still run through the certified host. NODE_OPTIONS is
      # inherited by its exact Vitest workers, so malformed input is tested
      # under the 128 MiB ceiling without creating an uncertified runner path.
      - name: Bounded hostile-input suites
        env:
          NODE_OPTIONS: '--max-old-space-size=128'
          TERMWRIGHT_RETRIES: '0'
        run: >-
          pnpm test -- --resource-profile ci --json -- --run
          packages/protocol/src
          packages/conformance/src/suites/adversarial.test.ts
          packages/conformance/src/suites/mcp-sessions.test.ts
          packages/ui/src/hostile.test.ts

  conpty-native-build:
    name: build the ConPTY addon (${{ matrix.arch }})
    # Pinned to the 2022 image on purpose. windows-latest now ships Visual
    # Studio 18, which node-gyp 11 cannot identify — it reports "unknown
    # version undefined" and gives up. Users are never asked to compile this
    # (prebuilds ship with the package), so the toolchain that produces the
    # binary and the Windows that runs it are separate choices, and this is
    # the one where the toolchain is supported.
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Both architectures users can run Windows on. arm64 is cross-compiled
        # here: node-gyp fetches that target's node.lib and the image carries
        # the ARM64 MSVC toolchain, so the binary is produced where the
        # toolchain is supported rather than where it will eventually run.
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Node-API, so one binary serves every supported Node line. Building it
      # twice per architecture would only prove the compiler runs twice.
      - name: Compile
        working-directory: packages/conpty
        run: pnpm exec node-gyp rebuild --arch=${{ matrix.arch }}

      # Into the package that publishes it, so the layout the release job packs
      # is the layout every other job already used.
      - name: Place the binary in its prebuild package
        shell: bash
        run: |
          set -euo pipefail
          cp packages/conpty/build/Release/termwright_conpty.node \
             "packages/conpty-win32-${{ matrix.arch }}/termwright_conpty.node"
          node scripts/check-prebuild.mjs "${{ matrix.arch }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conpty-addon-${{ matrix.arch }}
          path: packages/conpty-win32-${{ matrix.arch }}/termwright_conpty.node
          if-no-files-found: error
          retention-days: 1

  conpty-native:
    name: native ConPTY backend (Windows / Node ${{ matrix.node }})
    # 24H2, which is where ReleasePseudoConsole exists. The addon detects the
    # symbol rather than the version, and this is the image that proves the
    # modern path is the one taken.
    runs-on: windows-latest
    needs: conpty-native-build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conpty-addon-x64
          path: packages/conpty/build/Release

      - name: Record which pseudoconsole path this runner takes
        shell: bash
        run: |
          node -e "
            const { ConPtySession } = require('./packages/conpty/build/Release/termwright_conpty.node');
            const s = new ConPtySession({ commandLine: process.execPath + ' -e \"process.exit(0)\"', columns: 80, rows: 24 }, () => {});
            console.log('ReleasePseudoConsole available:', s.releaseSupported);
            s.dispose();
          "

      # Real pseudoconsole, real job object, real pipes. A skip here is a
      # failure: these cases exist because nothing else can prove them.
      - name: Certify the real ConPTY contract
        env: { TERMWRIGHT_RETRIES: '0' }
        run: pnpm test -- --resource-profile windows-ci --json -- --run packages/conpty/src

  windows-driver-native:
    name: build windows-latest / node ${{ matrix.node }}
    # The Windows build row. It is separate from the matrix because it has to
    # wait for the addon: Windows has one backend now, so a row that started
    # before the prebuild existed would have nothing to run on.
    #
    # This began as a comparison against node-pty and settled the question it
    # was built for. Against node-pty, Windows failed three cleanups that could
    # not confirm a tree was gone, plus settled() and the shell inference;
    # against the certified session, all five pass.
    runs-on: windows-latest
    needs: conpty-native-build
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conpty-addon-x64
          # Into the prebuild package rather than the build directory, so this
          # job resolves the addon the way an installed copy will. The build
          # directory is the developer's path and is already covered by the
          # certification job; this one is the users'.
          path: packages/conpty-win32-x64

      # A selection step, not a smoke test. If this prints the node-pty name
      # the job below proves nothing, and a silent fallback would make it look
      # like it had.
      - name: Confirm the driver selects the native backend
        shell: bash
        run: |
          node --input-type=module -e "
            const { resolveDefaultPtyBackend } = await import('./packages/driver/dist/index.js');
            const { backend, degradedReason } = await resolveDefaultPtyBackend();
            console.log('selected backend:', backend.name);
            if (degradedReason !== undefined) { console.error(degradedReason); process.exit(1); }
          "

      # The consumer's path, end to end: pack the prebuild and its parent,
      # install them into a clean directory, and make the installed copy open
      # a real pseudoconsole. Everything before this checks a working tree.
      - name: Verify a clean install resolves the prebuilt addon
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/termwright-conpty-packs"
          install_dir="$RUNNER_TEMP/termwright-conpty-install"
          mkdir -p "$pack_dir" "$install_dir"
          node scripts/check-prebuild.mjs x64
          pnpm --dir packages/conpty-win32-x64 pack --pack-destination "$pack_dir"
          pnpm --dir packages/conpty pack --pack-destination "$pack_dir"
          npm install --prefix "$install_dir" "$pack_dir"/*.tgz
          node scripts/check-installed-conpty.mjs "$install_dir"

      - run: pnpm -r --filter './packages/*' run typecheck
      - name: Verify packed driver on the native PTY backend
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/termwright-driver-packs"
          install_dir="$RUNNER_TEMP/termwright-driver-install"
          mkdir -p "$pack_dir" "$install_dir"
          pnpm --dir packages/protocol pack --pack-destination "$pack_dir"
          pnpm --dir packages/vt pack --pack-destination "$pack_dir"
          pnpm --dir packages/driver pack --pack-destination "$pack_dir"
          # The driver's Windows backend is an optional dependency that is not
          # published yet, so an install of the packed driver alone would skip
          # it and leave the installed copy with no backend at all.
          pnpm --dir packages/conpty-win32-x64 pack --pack-destination "$pack_dir"
          pnpm --dir packages/conpty pack --pack-destination "$pack_dir"
          npm install --prefix "$install_dir" "$pack_dir"/*.tgz
          node scripts/check-installed-driver.mjs "$install_dir"

      - name: Run the certified Termwright host
        run: pnpm test -- --resource-profile windows-ci --json

      # The Getting Started source is a real workspace package. This catches
      # stale imports, launch assumptions and expected output in the primary
      # documentation path on this row as well.
      - name: Run the Getting Started example
        run: pnpm test -- --resource-profile ci --json -- --run examples/getting-started

  determinism:
    name: determinism (50 native run cycles, zero retries)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build
      - name: Repeat concurrency-sensitive slices in one persistent host
        env: { TERMWRIGHT_RETRIES: '0' }
        run: >-
          pnpm test -- --runs 50 --resource-profile ci --json -- --run
          packages/resource-broker/src/index.test.ts
          packages/resource-broker/src/transport.test.ts
          packages/run-journal-transport/src/index.test.ts
          packages/driver/src/internal/resource-scope.test.ts
          packages/driver/src/session-lifecycle.test.ts
          packages/termwright-cli/src/test-host.integration.test.ts

  concurrency-stress:
    name: concurrency stress (16 owned terminals)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build
      - name: Saturate the explicit PTY/process/endpoint budget
        env: { TERMWRIGHT_RETRIES: '0' }
        run: >-
          pnpm test -- --resource-profile stress --json --
          --config quality/stress/vitest.config.ts --run
          quality/stress/terminal-concurrency.test.ts

  resource-leak:
    name: resource leak barrier (25 lifecycle cycles)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build
      - name: Every cycle must finish with zero broker leases and owned processes
        env: { TERMWRIGHT_RETRIES: '0' }
        run: >-
          pnpm test -- --runs 25 --resource-profile ci --json --
          --config quality/soak/vitest.config.ts --run
          quality/soak/terminal-cycle.test.ts

  fault-and-jitter:
    name: fault injection and slow causal boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build
      - name: Acquisition, persistence, handshake and cleanup fault matrix
        env: { TERMWRIGHT_RETRIES: '0' }
        run: >-
          pnpm test -- --resource-profile ci --json -- --run
          packages/driver/src/internal/resource-scope.test.ts
          packages/driver/src/session-lifecycle.test.ts
          packages/driver/src/semantic.test.ts
          packages/run-history/src/index.test.ts
          packages/run-journal-transport/src/index.test.ts
          packages/termwright-cli/src/test-host.test.ts
          packages/conformance/src/suites/adversarial.test.ts

  randomized-race:
    name: randomized race (recorded seed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build
      - name: Shuffle concurrency-sensitive tests with a reproducible seed
        shell: bash
        env: { TERMWRIGHT_RETRIES: '0' }
        run: |
          set -euo pipefail
          seed=$(( ${{ github.run_id }} % 2147483647 ))
          echo "Termwright randomized-race seed: $seed"
          echo "### Randomized-race seed: \`$seed\`" >> "$GITHUB_STEP_SUMMARY"
          pnpm test -- --runs 10 --resource-profile stress --json -- \
            --sequence.shuffle --sequence.seed="$seed" --run \
            packages/resource-broker/src packages/run-journal-transport/src \
            packages/driver/src/semantic.test.ts packages/driver/src/session-lifecycle.test.ts

  windows-native-stress:
    name: Windows native lifecycle stress / Node ${{ matrix.node }}
    runs-on: windows-latest
    needs: conpty-native-build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build

      # Windows has one pseudo-terminal backend and it is a native addon, so
      # every Windows row needs the compiled binary before it can launch
      # anything. There is no fallback to run on if it is absent.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conpty-addon-x64
          path: packages/conpty-win32-x64


      - name: ConPTY process tree, close-under-load and worker pressure
        shell: bash
        env: { TERMWRIGHT_RETRIES: '0' }
        run: |
          set -euo pipefail
          pnpm test -- --resource-profile windows-ci --json -- --run \
            packages/driver/src/process-lifecycle.pty.test.ts \
            packages/driver/src/pty-upstream-boundary.test.ts \
            packages/driver/src/session-lifecycle.test.ts
          pnpm test -- --resource-profile stress --json -- \
            --config quality/stress/vitest.config.ts --run \
            quality/stress/terminal-concurrency.test.ts

  conformance:
    needs: conpty-native-build
    name: conformance ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Every suite here spawns a process, a pty and a socket per test, so this
    # lane is minutes rather than seconds. The default 360 would hide a hang.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm

      # The adapter-contract rows for Textual and tview drive real apps as
      # subprocesses. Without these toolchains those rows skip, and a skipped
      # certification is not a certification.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24'
          cache-dependency-path: clients/go/go.sum

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build

      # Windows has one pseudo-terminal backend and it is a native addon, so
      # every Windows row needs the compiled binary before it can launch
      # anything. There is no fallback to run on if it is absent.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: runner.os == 'Windows'
        with:
          name: conpty-addon-x64
          path: packages/conpty-win32-x64



      - name: Install the Python client (Textual adapter row)
        run: pip install -e "clients/python[dev]"

      # Exits 0/1. Where no pty can be opened it skips everything and says so;
      # ubuntu and macOS have one, and Windows is the row to watch for ConPTY.
      # bash + pipefail on every OS: piping through `tee` in PowerShell would
      # report the pipe's status, turning a failed matrix into a green step.
      - name: Run the conformance matrix
        id: matrix
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @termwright/conformance run conformance | tee conformance-matrix.txt

      # Partial skips are reported as "pass, N skip", which is exactly the thing
      # that disappears in a green checkmark unless it is written down.
      - name: Publish the matrix to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Conformance matrix — ${{ matrix.os }}"
            echo
            echo '```'
            cat conformance-matrix.txt 2>/dev/null || echo "(the matrix produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ui-browser:
    name: runner UI end-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `vite build` produces dist/app, which the server serves. Without it the
      # browser would load nothing and every assertion would fail on an empty
      # page rather than on the thing under test.
      - run: pnpm -r --filter './packages/*' run build

      # `pnpm --filter X run <missing script>` exits 0. This job exists to run
      # one specific suite, so its absence has to be an error — otherwise the
      # lane goes green having opened no browser at all.
      - name: The browser suite must exist
        shell: bash
        run: |
          if ! node -e 'process.exit(require("./packages/ui/package.json").scripts?.["test:browser"] ? 0 : 1)'; then
            echo "::error::packages/ui has no test:browser script — this lane cannot verify anything."
            exit 1
          fi

      - name: Install Chromium
        run: pnpm --filter @termwright/ui exec playwright install --with-deps chromium

      # Asserts the three panes, the test list, time travel, the crash panel and
      # the log panel against a real browser driving a real server.
      - run: pnpm --filter @termwright/ui run test:browser

      - name: Upload the failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-browser-artifacts
          path: |
            packages/ui/test-results
            packages/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  opentui:
    name: opentui adapter contract (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm

      # OpenTUI loads its native Zig library through bun:ffi, so this suite
      # cannot run under Node at all. Without Bun on PATH it skips itself, and
      # CI would claim adapter coverage it does not have.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build
      - run: bun --version

      # Without the flag a missing precondition (no Bun, no dist/) skips the
      # suite, and vitest exits 0 on a skip — this job would go green without
      # running the tests it exists for. The flag turns that into a failure
      # naming the reason. Skipping stays the default on a developer machine.
      - run: pnpm --filter @termwright/opentui run test:conformance
        env:
          TERMWRIGHT_REQUIRE_CONFORMANCE: '1'

      # The injection suite runs each case twice, under Bun and under Node. On a
      # runner without Bun the Bun arms drop out (and the suite says so with an
      # explicit test), so this lane is the only place they execute at all.
      - run: pnpm --filter @termwright/probe-opentui run test
      - run: pnpm --filter @termwright/probe-ink run test

  clients:
    name: clients (${{ matrix.client }}${{ matrix.python && format(' {0}', matrix.python) || '' }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Python client declares >=3.9, so the floor is tested, not assumed.
        include:
          - client: python
            python: '3.9'
          - client: python
            python: '3.12'
          - client: go
          - client: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: matrix.client == 'python'
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.client == 'go'
        with:
          go-version: '1.24'
          cache-dependency-path: clients/go/go.sum

      # clippy is not in the default profile, and the probe's lint step needs it.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: matrix.client == 'rust'
        with:
          components: clippy

      # The toolchain is installed by the step above, so a missing one is a
      # setup failure rather than a reason to skip: no continue-on-error here.
      - name: Verify the toolchain is present
        run: |
          case "${{ matrix.client }}" in
            python) python --version ;;
            go)     go version ;;
            rust)   cargo --version ;;
          esac

      - name: Python tests
        if: matrix.client == 'python'
        working-directory: clients/python
        run: |
          pip install -e ".[dev]"
          if [ "${{ matrix.python }}" = "3.12" ]; then
            pip install uv poetry
            command -v uv
            command -v poetry
          fi
          pytest

      - name: Go tests
        if: matrix.client == 'go'
        working-directory: clients/go
        run: go test ./...

      - name: Rust tests
        if: matrix.client == 'rust'
        working-directory: clients/rust
        run: cargo test

      # The Ratatui probe is a second crate, not a member of the first's
      # workspace, so nothing above reaches it.
      - name: Rust probe — build, test, lint
        if: matrix.client == 'rust'
        working-directory: clients/rust-probe
        env:
          TERMWRIGHT_REQUIRE_RATATUI: '1'
        run: |
          cargo build --locked
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Ratatui annotation SDK — build, test, lint
        if: matrix.client == 'rust'
        working-directory: clients/rust-ratatui
        run: |
          cargo build --locked
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

  rust-windows-transport:
    name: Rust semantic transport (Windows named pipe)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Real named-pipe handshake and publication
        working-directory: clients/rust
        run: cargo test --locked --test windows_named_pipe

  release-hygiene:
    name: release hygiene
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24'
          cache: false

      # The protocol version is carried by the language clients plus the two
      # publishable Ratatui crates and their lockfiles. They drift silently
      # otherwise, and the first symptom is a release whose registry artifacts
      # disagree about the wire format.
      - name: Protocol lockstep
        run: node scripts/sync-protocol-version.mjs --check

      - run: pnpm install --frozen-lockfile

      - name: ESLint 9 source gate
        run: pnpm lint

      - name: GitHub Actions syntax and shell safety
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      - name: Compatibility registry matches probe declarations
        run: pnpm run test:compatibility

      # A change to a published package without a changeset is a change that
      # ships with no changelog entry and no version bump. Release-only PRs are
      # exempt: `changeset version` consumes the files it was given.
      - name: A PR touching packages/** needs a changeset
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE" "$HEAD" -- 'packages/**' || true)
          if [ -z "$changed" ]; then
            echo "no packages/** changes — nothing to require"
            exit 0
          fi

          added=$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" -- '.changeset/*.md' \
            | grep -v '.changeset/README.md' || true)
          if [ -n "$added" ]; then
            echo "changeset present:"
            echo "$added"
            exit 0
          fi

          echo "::error::this PR changes packages/** but adds no changeset. Run \`pnpm changeset\`, or add the 'release' label if the change genuinely ships nothing (docs, tests, comments)."
          echo 'Changed files:'
          echo "$changed"
          exit 1

  rust-msrv:
    name: clients (rust MSRV 1.74)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Exactly the floor Cargo.toml declares. Testing on anything newer would
      # prove the wrong thing: the crate compiled on 1.82 while claiming 1.74 is
      # how a method stabilised in 1.82 reached a release unnoticed.
      - uses: dtolnay/rust-toolchain@047d2b4827f7f487d4c6e0990938bc379aece81d # 1.74

      # Both crates declare a floor, and both are checked: a lane pinned to
      # 1.74 proves nothing about a crate that has quietly moved to 1.80.
      - name: Every crate's declared floor must match the toolchain
        shell: bash
        run: |
          set -euo pipefail
          actual=$(rustc --version | cut -d' ' -f2)

          # Compare on major.minor only. A patch release is not a different
          # floor, and the toolchain action serves the newest patch in the
          # series — so a Cargo.toml that ever says "1.74.0" must not fail this
          # guard against a 1.74.1 runner with nothing actually wrong.
          minor() { echo "$1" | cut -d. -f1,2; }

          for crate in clients/rust clients/rust-probe; do
            declared=$(grep -m1 '^rust-version' "$crate/Cargo.toml" | sed 's/.*"\(.*\)".*/\1/')
            echo "$crate declares $declared, toolchain is $actual"
            if [ -z "$declared" ]; then
              echo "::error::$crate/Cargo.toml declares no rust-version — this lane cannot know what it is proving"
              exit 1
            fi
            if [ "$(minor "$declared")" != "$(minor "$actual")" ]; then
              echo "::error::$crate wants $(minor "$declared").x but this job runs $actual — repin the toolchain or align rust-version"
              exit 1
            fi
          done

      # Build, not test: MSRV is a promise to whoever *depends* on the crate,
      # and a dependent compiles the library. Compiling the test binaries would
      # drag dev-dependencies into the floor, so an unrelated crate raising its
      # own MSRV would fail this lane with nothing wrong on our side.
      - name: Build on the floor
        working-directory: clients/rust
        run: cargo build --locked

      # The tracing bridge is a documented option, so it is part of the promise.
      # If this step is what fails, the fix is to document that the feature needs
      # a newer Rust — not to quietly raise the floor for everyone.
      - name: Build with every feature
        working-directory: clients/rust
        run: cargo build --locked --all-features

      - name: Build the Ratatui probe on the floor
        working-directory: clients/rust-probe
        run: cargo build --locked

  rust-ratatui-msrv:
    name: Ratatui SDK (Rust MSRV 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88

      - name: Declared floor and framework pin match this lane
        shell: bash
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^rust-version' clients/rust-ratatui/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          actual=$(rustc --version | cut -d' ' -f2 | cut -d. -f1,2)
          framework=$(sed -n 's/^ratatui = { version = "=\([^"]*\)".*/\1/p' clients/rust-ratatui/Cargo.toml)
          test "$declared" = "$actual"
          test "$declared" = "1.88"
          test "$framework" = "0.30.2"

      - name: Build and test on the SDK floor
        working-directory: clients/rust-ratatui
        run: |
          cargo build --locked
          cargo test --locked

  vectors:
    name: cross-language vectors are current
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @termwright/protocol run build

      # The generator re-runs every expectation through the reference
      # implementation, so a stale or hand-edited vector shows up as a diff.
      - run: node clients/test-vectors/generate.mjs
      - name: Fail if the committed vectors drifted
        run: git diff --exit-code -- clients/test-vectors

  examples:
    name: examples (dogfooding)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25'
          cache-dependency-path: |
            examples/tview-menu/go.sum
            examples/bubbletea-login/app/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.2.15'
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build
      - run: pnpm -r --filter './examples/*' run build

      - name: Install the Python client for the Textual example
        run: pip install -e "clients/python[textual]"

      - name: Run every public example without skips
        env:
          TERMWRIGHT_REQUIRE_EXAMPLES: '1'
        run: >-
          pnpm test -- --resource-profile ci --json -- --run
          examples/bubbletea-login examples/getting-started examples/ink-todo
          examples/opentui-form examples/ratatui-list examples/textual-notes
          examples/tview-menu

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: example-termwright-reports
          path: examples/*/termwright-report
          if-no-files-found: ignore
          retention-days: 7

  website:
    name: website builds
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @termwright/website run check
      - run: pnpm --filter @termwright/website run build
      - run: pnpm --filter @termwright/website run check:links
