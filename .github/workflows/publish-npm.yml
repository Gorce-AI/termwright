name: Publish — npm

# The one npm trusted-publisher identity. Stable releases are checked out at an
# immutable tag; canaries may build an arbitrary repository ref, but only in an
# unprivileged job which hands validated tarballs to the approved publisher.
# Nothing here runs on a push.
#
# Publish order across registries is crates.io -> PyPI -> npm; see RELEASING.md.
# npm goes last because it is the one registry with a staging buffer.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Publish a stable release or a canary snapshot'
        required: true
        default: release
        type: choice
        options:
          - release
          - canary
      ref:
        description: 'Release anchor tag, or branch/commit to build in canary mode'
        required: true
        default: main
        type: string
      dry_run:
        description: 'Resolve and pack everything, publish nothing'
        required: true
        default: true
        type: boolean
      dist_tag:
        description: 'Stable-release dist-tag. Ignored in canary mode.'
        required: true
        default: latest
        type: string
      canary_tag:
        description: 'Canary label/dist-tag: canary, canary-*, or canary.*. Ignored in release mode.'
        required: true
        default: canary
        type: string

concurrency:
  group: publish-npm-${{ inputs.ref }}
  # Never cancel a publish in flight: a cancelled run can leave some packages
  # published and others not, which is the one state that needs a human.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify ${{ inputs.ref }}
    if: inputs.mode == 'release'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.protocol }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.ref }}
          fetch-depth: 0

      - name: Bind the checkout to the exact anchor tag
        id: source
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$REF" in protocol/v*) ;; *) echo "::error::invalid release anchor $REF"; exit 1 ;; esac
          tag_commit=$(git rev-parse "refs/tags/$REF^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error::checkout HEAD $head_commit is not tag $REF ($tag_commit)"
            exit 1
          fi
          if [ "$WORKFLOW_REF" != "refs/tags/$REF" ] || [ "$WORKFLOW_SHA" != "$tag_commit" ]; then
            echo "::error::dispatch this workflow itself on tag $REF so npm provenance names the verified source"
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: The tag must agree with the manifests
        id: versions
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          protocol=$(node -p "require('./packages/protocol/package.json').version")
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"

          expected_ref="protocol/v$protocol"
          if [ "$REF" != "$expected_ref" ]; then
            echo "::error::expected immutable release anchor $expected_ref, got $REF"
            exit 1
          fi


      - uses: pnpm/action-setup@v6
        with:
          version: '9.4.0'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: node scripts/sync-protocol-version.mjs --check
      - run: node scripts/check-package-metadata.mjs

      - name: Refuse to publish a workspace with unapplied changesets
        shell: bash
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l | tr -d ' ')
          if [ "$pending" != "0" ]; then
            echo "::error::$pending changeset(s) unapplied — this ref is not a release commit."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build
      - run: pnpm -r --filter './packages/*' run typecheck
      - run: pnpm -r --filter './packages/*' run test

      - name: Pack every publishable package
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-pack"
          mkdir -p "$pack_dir"

          for dir in packages/*/; do
            private=$(node -p "require('./${dir}package.json').private === true")
            [ "$private" = "true" ] && continue

            # pnpm owns the workspace: protocol. `npm pack` would publish those
            # strings literally, leaving consumers with unsupported dependency
            # ranges. Pack with pnpm, then inspect the exact upload manifest.
            archive=$(cd "$dir" && pnpm pack --pack-destination "$pack_dir" | tail -n 1)
            test -f "$archive"
            manifest=$(tar -xOf "$archive" package/package.json)
            if grep -q 'workspace:' <<<"$manifest"; then
              echo "::error::$archive still contains an unexpanded workspace dependency"
              exit 1
            fi
            repository=$(node -p "JSON.parse(process.argv[1]).repository?.url ?? ''" "$manifest")
            directory=$(node -p "JSON.parse(process.argv[1]).repository?.directory ?? ''" "$manifest")
            expected_directory=${dir#packages/}
            expected_directory=${expected_directory%/}
            if [ "$repository" != 'git+https://github.com/Gorce-AI/termwright.git' ] || \
              [ "$directory" != "packages/$expected_directory" ]; then
              echo "::error::$archive has repository '$repository' / '$directory'; npm provenance requires the exact source repository"
              exit 1
            fi
          done

  publish:
    name: publish to npm
    needs: verify
    if: inputs.mode == 'release' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    # Required reviewers live on this environment. Approval is the gate, and it
    # is the reason this workflow can be dispatched by anyone but released by
    # few. OIDC also requires a GitHub-hosted runner — self-hosted cannot mint
    # the token.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC); provenance comes with it
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.commit }}

      - uses: pnpm/action-setup@v6
        with:
          version: '9.4.0'

      # No `cache: pnpm` here on purpose: a publish job should resolve from the
      # registry rather than from a cache another workflow populated.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1 (and Node >= 22.14). Asserted
      # rather than assumed: an older npm falls back to token auth, finds no
      # token, and fails with something far less obvious than this message.
      - name: npm must be new enough for trusted publishing
        shell: bash
        run: |
          npm install -g npm@11.5.1
          # shellcheck disable=SC2016  # the JS below is quoted for node, not for the shell
          NPM_VERSION="$(npm --version)" node -e '
            const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            console.log(`npm ${process.env.NPM_VERSION}`);
            if (!ok) {
              console.error(`::error::npm ${process.env.NPM_VERSION} is too old for OIDC publishing (need >= 11.5.1)`);
              process.exit(1);
            }
          '

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build

      - name: Publish
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ inputs.dist_tag }}
          # No NPM_TOKEN: authentication is OIDC. Classic tokens were revoked in
          # December 2025, and a token here would silently take precedence.
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-publish"
          mkdir -p "$pack_dir"

          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            private=$(node -p "require('./${dir}package.json').private === true")
            [ "$private" = "true" ] && continue

            # Already-published is a normal state during a retry after a partial
            # failure, not an error. Never republish, never yank.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already on the registry, skipping"
              continue
            fi

            archive=$(cd "$dir" && pnpm pack --pack-destination "$pack_dir" | tail -n 1)
            test -f "$archive"
            manifest=$(tar -xOf "$archive" package/package.json)
            if grep -q 'workspace:' <<<"$manifest"; then
              echo "::error::$archive still contains an unexpanded workspace dependency"
              exit 1
            fi
            repository=$(node -p "JSON.parse(process.argv[1]).repository?.url ?? ''" "$manifest")
            if [ "$repository" != 'git+https://github.com/Gorce-AI/termwright.git' ]; then
              echo "::error::$archive does not identify the GitHub repository required by npm provenance"
              exit 1
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "would publish $name@$version --tag $DIST_TAG"
              npm publish --dry-run --access public --tag "$DIST_TAG" \
                --workspaces=false --provenance=false "$archive"
            else
              echo "publishing $name@$version --tag $DIST_TAG"
              npm publish --access public --tag "$DIST_TAG" \
                --workspaces=false "$archive"
            fi
          done

      - name: Summary
        if: always()
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          summary_ref=$(printf '%s' "$REF" | tr '\r\n' '  ')
          summary_tag=$(printf '%s' "$DIST_TAG" | tr '\r\n' '  ')
          # shellcheck disable=SC2016  # backticks and $ inside single quotes are literal markdown
          {
            echo "## npm — $summary_ref"
            echo
            printf 'dry run: `%s`  ·  dist-tag: `%s`\n' "$DRY_RUN" "$summary_tag"
            echo
            echo 'Packages already present on the registry are skipped, so re-dispatching after a partial failure is safe.'
          } >> "$GITHUB_STEP_SUMMARY"

  canary_prepare:
    name: build and pack canary without registry credentials
    if: inputs.mode == 'canary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: '9.4.0'

      - uses: actions/setup-node@v7
        with:
          node-version: '22.14'

      - run: pnpm install --frozen-lockfile

      # Snapshot versioning and every project lifecycle command stay outside
      # the OIDC job. The approved publisher receives only immutable tarballs.
      - name: Version as a canary snapshot
        env:
          SNAPSHOT_TAG: ${{ inputs.canary_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SNAPSHOT_TAG" =~ ^canary([.-][0-9A-Za-z]+)*$ ]]; then
            echo "::error::the canary label must be 'canary' or start with 'canary-' / 'canary.'"
            exit 1
          fi
          pnpm changeset version --snapshot "$SNAPSHOT_TAG"

      # Changesets updates manifests but not the generated probe handshake
      # constants. Align those and the language-client lockfiles before build.
      - run: node scripts/sync-protocol-version.mjs
      - run: node scripts/sync-protocol-version.mjs --check
      - run: pnpm run test:compatibility
      - run: pnpm -r --filter './packages/*' run build
      - run: pnpm -r --filter './packages/*' run test

      - name: Pack every public package
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-canary"
          mkdir -p "$pack_dir"

          for dir in packages/*/; do
            private=$(node -p "require('./${dir}package.json').private === true")
            [ "$private" = "true" ] && continue
            archive=$(cd "$dir" && pnpm pack --pack-destination "$pack_dir" | tail -n 1)
            test -f "$archive"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: npm-canary-tarballs
          path: ${{ runner.temp }}/npm-canary/*.tgz
          if-no-files-found: error
          retention-days: 7

  canary_publish:
    name: publish verified canary tarballs
    needs: canary_prepare
    if: inputs.mode == 'canary' && needs.canary_prepare.result == 'success'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # This is deliberately the same workflow identity as the stable publish:
      # npm supports one trusted-publisher configuration per package. No source
      # checkout, dependency install or project code runs with OIDC permission.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11.5.1

      - uses: actions/download-artifact@v4
        with:
          name: npm-canary-tarballs
          path: ${{ runner.temp }}/npm-canary

      - name: Validate and publish under the canary tag
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ inputs.canary_tag }}
          # The packed source may differ from github.ref/github.sha. Disable
          # automatic provenance rather than attach a misleading source claim.
          NPM_CONFIG_PROVENANCE: 'false'
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-canary"
          if [[ ! "$TAG" =~ ^canary([.-][0-9A-Za-z]+)*$ ]]; then
            echo "::error::invalid canary dist-tag"
            exit 1
          fi

          # The privileged job accepts the repository's exact public-package
          # set, not arbitrary names supplied by the unprivileged source ref.
          allowed=(
            '@termwright/conformance' '@termwright/driver' '@termwright/gherkin' '@termwright/ink'
            '@termwright/ink-testing' '@termwright/logs' '@termwright/mcp'
            '@termwright/opentui' '@termwright/probe-charm' '@termwright/probe-go'
            '@termwright/probe-ink' '@termwright/probe-opentui' '@termwright/probe-runtime'
            '@termwright/probe-tview' '@termwright/protocol' '@termwright/recognizers'
            '@termwright/screenshot' '@termwright/test' '@termwright/trace'
            '@termwright/ui' '@termwright/vt' 'termwright'
          )
          declare -A expected=()
          declare -A seen=()
          for name in "${allowed[@]}"; do expected["$name"]=1; done

          shopt -s nullglob
          archives=("$pack_dir"/*.tgz)
          if [ "${#archives[@]}" -ne "${#allowed[@]}" ]; then
            echo "::error::received ${#archives[@]} tarballs, expected ${#allowed[@]}"
            exit 1
          fi

          for archive in "${archives[@]}"; do
            manifest=$(tar -xOf "$archive" package/package.json)
            name=$(node -p "JSON.parse(process.argv[1]).name" "$manifest")
            version=$(node -p "JSON.parse(process.argv[1]).version" "$manifest")
            private=$(node -p "JSON.parse(process.argv[1]).private === true" "$manifest")

            if [ -z "${expected[$name]+x}" ] || [ -n "${seen[$name]+x}" ]; then
              echo "::error::unexpected or duplicate package name $name in $archive"
              exit 1
            fi
            seen["$name"]=1
            if [ "$private" = "true" ] || grep -q 'workspace:' <<<"$manifest"; then
              echo "::error::$archive is private or contains an unexpanded workspace dependency"
              exit 1
            fi
            case "$version" in
              "0.0.0-$TAG-"*) ;;
              *)
                echo "::error::$name has non-canary version $version"
                exit 1
                ;;
            esac
            suffix=${version#"0.0.0-$TAG-"}
            if [[ ! "$suffix" =~ ^[0-9]{14}$ ]]; then
              echo "::error::$name has malformed canary timestamp in $version"
              exit 1
            fi

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already on the registry, skipping"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "would publish $name@$version --tag $TAG"
              npm publish --dry-run --access public --tag "$TAG" \
                --workspaces=false --ignore-scripts --provenance=false "$archive"
            else
              echo "publishing $name@$version --tag $TAG"
              npm publish --access public --tag "$TAG" \
                --workspaces=false --ignore-scripts --provenance=false "$archive"
            fi
          done

      - name: Summary
        if: always()
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          TAG: ${{ inputs.canary_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          summary_ref=$(printf '%s' "$REF" | tr '\r\n' '  ')
          summary_tag=$(printf '%s' "$TAG" | tr '\r\n' '  ')
          # shellcheck disable=SC2016  # backticks and $ inside single quotes are literal markdown
          {
            echo "## Canary — $summary_ref"
            echo
            printf 'dist-tag: `%s`  ·  dry run: `%s`\n' "$summary_tag" "$DRY_RUN"
            echo
            printf 'Install with `npm i @termwright/driver@%s`. `latest` was not moved.\n' "$summary_tag"
          } >> "$GITHUB_STEP_SUMMARY"
