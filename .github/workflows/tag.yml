name: Tag release

# Step 2 of a release, run after the Version PR is merged. The unprivileged
# job verifies the source. Only the approved job receives write credentials,
# and it runs no project lifecycle/build code with them in scope.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or protected branch containing the merged Version PR'
        required: true
        default: main
        type: string

concurrency:
  group: tag-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify release source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a commit reachable from an allowed release line
        id: source
        shell: bash
        run: |
          set -euo pipefail
          head_commit=$(git rev-parse HEAD)
          git fetch --force origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'

          allowed=false
          if git merge-base --is-ancestor "$head_commit" refs/remotes/origin/main; then
            allowed=true
          fi
          while IFS= read -r branch; do
            short=${branch#refs/remotes/origin/}
            [[ "$short" =~ ^release/[0-9]+\.x$ ]] || continue
            if git merge-base --is-ancestor "$head_commit" "$branch"; then
              allowed=true
              break
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/release/)

          if [ "$allowed" != "true" ]; then
            echo "::error::$head_commit is not reachable from main or an allowlisted release/N.x branch"
            exit 1
          fi

          version=$(node -p "JSON.parse(require('node:fs').readFileSync('packages/protocol/package.json', 'utf8')).version")
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: '9.4.0'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refuse a source that still has pending changesets
        shell: bash
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l | tr -d ' ')
          if [ "$pending" != "0" ]; then
            echo "::error::$pending changeset(s) are still unapplied — merge the Version PR first."
            exit 1
          fi

      - name: Verify the protocol lockstep
        run: node scripts/sync-protocol-version.mjs --check

  tag:
    name: create coordinated tags
    needs: verify
    runs-on: ubuntu-latest
    environment: release-tag
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0

      - name: Create and push the coordinated tag set atomically
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          head_commit=$(git rev-parse HEAD)
          if [ "$head_commit" != "$VERIFIED_COMMIT" ]; then
            echo "::error::approved checkout $head_commit differs from verified $VERIFIED_COMMIT"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          mapfile -t tags < <(node <<'NODE'
          const fs = require('node:fs');
          for (const directory of fs.readdirSync('packages').sort()) {
            const path = `packages/${directory}/package.json`;
            if (!fs.existsSync(path)) continue;
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (manifest.private !== true) console.log(`${manifest.name}@${manifest.version}`);
          }
          NODE
          )
          tags+=("protocol/v$VERSION" "clients/go/v$VERSION")

          for tag in "${tags[@]}"; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              tagged_commit=$(git rev-parse "refs/tags/$tag^{commit}")
              if [ "$tagged_commit" != "$head_commit" ]; then
                echo "::error::existing tag $tag points to $tagged_commit, expected $head_commit"
                exit 1
              fi
            else
              git tag -a "$tag" -m "$tag"
              echo "created $tag"
            fi
          done

          refs=()
          for tag in "${tags[@]}"; do
            tagged_commit=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$tagged_commit" != "$head_commit" ]; then
              echo "::error::tag $tag points to $tagged_commit after creation, expected $head_commit"
              exit 1
            fi
            refs+=("refs/tags/$tag:refs/tags/$tag")
          done

          # Either the complete coordinated set moves, or none of it does.
          # A concurrent conflicting tag makes the atomic push fail closed.
          git push --atomic origin "${refs[@]}"

      # Draft, not published: release notes go live only after all registry
      # artifacts have been independently confirmed by finalize-release.yml.
      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          tag="protocol/v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists, leaving it alone"
            exit 0
          fi
          gh release create "$tag" \
            --draft \
            --title "termwright — protocol v$VERSION" \
            --generate-notes

      - name: Summary
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # shellcheck disable=SC2016  # backticks and $ inside single quotes are literal markdown
          {
            echo "## Tagged"
            echo
            echo "Anchor ref: \`protocol/v$VERSION\` — pass it as \`ref\` to the publish workflows."
            echo
            echo '### Next, in this order (each needs an approval)'
            echo
            echo '1. `publish-crate.yml` — crates.io is the least reversible.'
            echo '2. `publish-pypi.yml`'
            echo '3. `publish-npm.yml`'
            echo '4. `finalize-release.yml` — publishes the draft release.'
            echo
            echo 'Dry-run each one first: every publish workflow takes `dry_run`.'
          } >> "$GITHUB_STEP_SUMMARY"
