# @termwright/test snapshots — generated, but review them like test source.
# Update with `vitest -u` or TERMWRIGHT_UPDATE_SNAPSHOTS=changed.
"starts on the list it was seeded with 1": |
  - application:
      - text "Termwright Todo"
      - textbox "Filter" [focused]:
          - 'text "Filter: _"'
      - list "Todos" [orientation=vertical]:
          - listitem "write the README" [selected,checked]:
              - text "> [x] write the README"
          - listitem "record a demo":
              - text "[ ] record a demo"
          - listitem "ship 1.0":
              - text "[ ] ship 1.0"
      - button "Add" [disabled]:
          - text "Add"
      - button "Remove":
          - text "Remove"
      - 'text "status: ready"'
