<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>termwright</title>
    <!-- Inline, because the app must render on a machine with no network. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230e1117'/%3E%3Cpath d='M3 5l3 3-3 3M8 11h5' stroke='%237aa2f7' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main class="layout">
      <section class="pane terminal-pane">
        <header class="pane-head">
          <h2>Terminal</h2>
          <span class="warn" id="profile-notice" hidden></span>
          <span class="spacer"></span>
          <button id="shortcuts-toggle" title="Keyboard shortcuts" aria-expanded="false">?</button>
          <button id="theme-toggle" title="Switch between the dark and light theme">◐</button>
        </header>
        <div id="terminal" class="terminal"></div>
      </section>
      <div class="splitter vertical" id="split-main" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize the side panel"></div>
      <section class="pane" id="inspector"></section>
      <div class="splitter horizontal" id="split-bottom" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize the bottom panel"></div>
      <section class="pane" id="timeline"></section>
      <aside id="shortcuts" class="shortcuts" hidden>
        <h2>Keyboard</h2>
        <dl>
          <dt><kbd>Space</kbd></dt><dd>play / pause the replay</dd>
          <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>previous / next action</dd>
          <dt><kbd>↑</kbd> <kbd>↓</kbd></dt><dd>walk the semantic tree</dd>
          <dt><kbd>Enter</kbd></dt><dd>focus the terminal from the tree</dd>
          <dt><kbd>?</kbd></dt><dd>this list</dd>
        </dl>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
